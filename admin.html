<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>CADTrack 360 · admin</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><meta name="theme-color" content="#0B1F44">
<style>
:root{--navy:#0A1B3F;--navy2:#12306B;--blue:#2F7BFF;--gold:#F5B301;--ink:#10213F;--mute:#5E6B82;--line:#DCE3EF;--ok:#0F9D6E;--bad:#D6453B;--rev:#7B54D6}
*{box-sizing:border-box}html{background:#E9EFF8}
body{margin:0;font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:var(--cad) 0 0/900px 700px repeat,linear-gradient(180deg,#F1F5FC,#E2EAF6);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:linear-gradient(120deg,rgba(10,27,63,.97),rgba(18,48,107,.97));color:#fff;border-bottom:2px solid var(--gold);box-shadow:0 10px 28px -12px rgba(10,27,63,.7)}
.brand{display:flex;gap:10px;align-items:center}.brand b{font-size:17px}.brand small,.who small{display:block;color:#9FB7E6;font-size:11px}
.who{text-align:right;line-height:1.25;font-size:13px}.sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 20px 0;max-width:1140px;margin:0 auto}
.tabs button{border:0;background:rgba(255,255,255,.65);padding:10px 16px;border-radius:12px 12px 0 0;color:var(--mute);font-weight:600;white-space:nowrap;min-height:44px}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
main{max-width:1140px;margin:0 auto;padding:18px 20px 48px}
h2{margin:2px 0 14px;font-size:22px;letter-spacing:-.2px}h3{margin:0 0 8px;font-size:16px}
.card{background:#fff;border:1px solid rgba(220,227,239,.9);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 14px 32px -20px rgba(10,27,63,.45)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.grid .card{margin:0}
.stat{background:linear-gradient(150deg,#fff,#F3F7FF)}.stat b{font-size:30px;display:block;color:var(--navy)}.stat span{color:var(--mute);font-size:13px}
.btn{background:linear-gradient(135deg,#3B86FF,#2563EB);color:#fff;border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;box-shadow:0 8px 16px -10px #2563EB}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.rev{background:var(--rev)}.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}.top .btn.alt{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.ib{position:relative}.ib i{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#000;border-radius:99px;font-size:11px;font-style:normal;padding:1px 6px;font-weight:700}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 12px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #9DC1FF;border-color:var(--blue)}
label{font-size:13px;color:var(--mute);font-weight:600}label.c{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;font-weight:500;margin:6px 0}label.c input{width:auto;margin:3px 0}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.bar{height:9px;background:#E4EAF5;border-radius:6px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%;border-radius:6px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);align-items:center}.sub{font-size:13px;color:var(--mute);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tw{overflow-x:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{width:auto;min-width:200px;margin:0}
.acts{display:flex;gap:5px;flex-wrap:wrap;min-width:230px}.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}.crow select{margin:0}.plist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:4px 0 10px}
dialog{border:0;border-radius:18px;padding:20px;width:min(580px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(10,27,63,.6)}dialog::backdrop{background:rgba(10,27,63,.6);backdrop-filter:blur(3px)}
.stars{display:flex;gap:6px;flex-wrap:wrap}.stars label{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;color:var(--ink);cursor:pointer}
.stars input{position:absolute;opacity:0}.stars label:has(input:checked){background:var(--gold);border-color:var(--gold);font-weight:700}.stars label:has(input:focus-visible){outline:2px solid var(--blue)}
.err{color:var(--bad);font-size:14px;min-height:20px}.empty{color:var(--mute);text-align:center;padding:28px}
.note{background:#FFF8E0;border:1px solid #F1DC96;border-radius:10px;padding:11px;font-size:13px;margin-bottom:12px}.note.bad{background:#FDECEA;border-color:#F3B8B2}
.hello p{margin:-8px 0 14px;color:var(--mute)}
#net{background:var(--bad);color:#fff;text-align:center;font-size:13px;padding:4px;display:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#login{display:grid;grid-template-columns:1.15fr .85fr;min-height:100vh}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 25% 15%,#1B4DA3,#0A1B3F 62%);color:#fff;display:flex;align-items:center;padding:56px}
.hero svg.cad{position:absolute;inset:0;width:100%;height:100%}.hero-in{position:relative;z-index:1;max-width:460px}
.hero h1{font-size:44px;margin:14px 0 0;letter-spacing:-1px}.hero .by{color:#9FB7E6;margin:2px 0 18px}.hero .tag{font-size:20px;color:var(--gold);font-weight:700;margin:0 0 22px}
.chips span{display:inline-block;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 14px;margin:0 8px 8px 0;font-size:13px;background:rgba(255,255,255,.07)}
.formside{display:flex;align-items:center;justify-content:center;padding:24px}.lf{width:min(400px,100%);padding:26px}.lf h2{margin-bottom:4px}
.dr{stroke-dasharray:1600;stroke-dashoffset:1600;animation:dr 7s ease-in-out infinite alternate}@keyframes dr{to{stroke-dashoffset:0}}
@media(max-width:820px){#login{grid-template-columns:1fr}.hero{padding:26px;min-height:240px}.hero h1{font-size:30px}.hero .tag{font-size:16px}.chips{display:none}.who{display:none}.crow{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.dr{animation:none;stroke-dashoffset:0}}
</style></head><body>

<script>
const ROLE='admin';const SEED=[{"id":"autocad2d_civil","name":"AutoCAD 2D Civil","category":"Civil","topics":[{"id":"T001","module":"AutoCAD 2D Civil","name":"S1 · Introduction & Projections","detail":"Introduction: About CADD centre, AutoCAD History, Engineering Drawings. Projections (First & Third angle), Views (Orthographic, Isometric & Perspective). Exploring GUI, Workspaces. Co-ordinate systems.","mandatory":true},{"id":"T002","module":"AutoCAD 2D Civil","name":"S2 · Drawing Settings & Display Control","detail":"Drawing settings: Units, Limits, Options, Application status Bar. Display Control: Zoom, Pan, Regen, Clean Screen & Drafting setting.","mandatory":true},{"id":"T003","module":"AutoCAD 2D Civil","name":"S3 · Object Properties & File Management","detail":"Object Properties: Color, Linetype, Ltscale, Lineweight. File Management: New, Qnew, Open, Save, Save as, Close, Exit, Quit.","mandatory":true},{"id":"T004","module":"AutoCAD 2D Civil","name":"S4 · Drawing & Modify Tools","detail":"Drawing Tools: Line, Xline, Polyline, Circle, Rectangle, Arc, Ellipse, Polygon, Donut. Modify Tools: Trim, Extend, Erase, Undo, Redo, Join, Explode, Offset, Move, Copy, Rotate, Mirror, Scale, Stretch, Lengthen, Break, Array, Align, Fillet, Chamfer.","mandatory":true},{"id":"T005","module":"AutoCAD 2D Civil","name":"S5 · Dimensioning","detail":"Dimension Setting: Dimension Style. Dimension: Linear, Aligned, Radius, Diameter, Center Mark, Angle, Arc length, Jogged radius, Ordinate dimensions, Continuous & Baseline dimension, Dimension Space, Dimension Break, Inspection, Tolerance.","mandatory":true},{"id":"T006","module":"AutoCAD 2D Civil","name":"S6 · Leader & Dimension Editing","detail":"Leader: Leader, Qleader, Mleader, Multi leader style, Add leader, Align Leader lines, Collect Leader. Dimension Editing: Dim edit, dimtedit, Dimension Associative, Reassociate.","mandatory":true},{"id":"T007","module":"AutoCAD 2D Civil","name":"S7 · Measurements & Annotation","detail":"Measurements: Divide, Measure. Annotation Tools: Text Style, Mtext, Scaletext, Spell.","mandatory":true},{"id":"T008","module":"AutoCAD 2D Civil","name":"S8 · Advanced Drawing & Modify Tools","detail":"Drawing Tools: Multiline, Pline, Spline, Ray, Wipeout, Revision cloud. Modify Tools: MLstyle, MLedit, Pedit, Splinedit, Grip Editing.","mandatory":true},{"id":"T009","module":"AutoCAD 2D Civil","name":"S9 · Civil Drawing & Project","detail":"Civil Drawing: Isometric View Drawing, Perspective View Drawing (one point & Two point). Project: Perspective View - Building Exterior (Two point perspective) & Interior (One point perspective).","mandatory":true},{"id":"T010","module":"AutoCAD 2D Civil","name":"S10 · Hatching & Inquiry Commands","detail":"Hatching utilities: Hatch, Hatchedit, Gradient. Inquiry commands: Id, Dist, List, Radius, Angle, Area, Volume, Fill, Fill mode.","mandatory":true},{"id":"T011","module":"AutoCAD 2D Civil","name":"S11 · Layer Management","detail":"Layer Management: Adding / Removing Layers, New Property Filter, New Group Filter, Layer States Manager.","mandatory":true},{"id":"T012","module":"AutoCAD 2D Civil","name":"S12 · Selection Methods & Tables","detail":"Selection Methods: Object Selection Methods, Qselect, Filter. Table: Table, Tablestyle, Tabledit.","mandatory":true},{"id":"T013","module":"AutoCAD 2D Civil","name":"S13 · Symbol & BOM Creation - Blocks","detail":"Symbol & BOM Creation: Block, Wblock, Insert. Attribute: Attdef, Attedit, Eattedit, Attdisp, Attdia.","mandatory":true},{"id":"T014","module":"AutoCAD 2D Civil","name":"S14 · Dynamic Blocks & Parametric Modeling","detail":"Symbol & BOM Creation: Dynamic Block. Parametric Modeling: Geometric Constraint, Dimensional Constraint, Design Centre, Tool Palette.","mandatory":true},{"id":"T015","module":"AutoCAD 2D Civil","name":"S15 · OLE, Copy-Paste & External References","detail":"OLE concepts: Insert object, Olelinks, Olescale. Copy & Paste Concepts: Copy, Copybase, Copylink, Pasteclip, Pastespecial, Pasteblock, Paste original. External references: Xref, Xbind, Refedit.","mandatory":true},{"id":"T016","module":"AutoCAD 2D Civil","name":"S16 · File Setup & Plot Control","detail":"File Setup: Hyperlink, Etransmit, Publish. Plot control: Introduction to plotting, Page setup, Plot Styles, Layout, Mview, Mspace, Pspace.","mandatory":true}]},{"id":"3dsmax","name":"3ds Max","category":"Visualisation","topics":[{"id":"T001","module":"3ds Max","name":"S1 · Introduction & Interface - Sofa Models","detail":"Creating a 3 Seater and single seater Sofa with different visual styles: Need for 3D, Introduction about 3ds Max Project work flow - Modeling, Texturing, Lighting, Animation, Rendering and Compositing. Definition for Max for Engineers/Architects. User interface - Command Panel, Main Toolbar, Customizing Viewport, View port controls. Different Visual styles (Quadro graphics card and recommended). Explain about different Output file formats - JPEG, GIFF, TIFF, AVI, BMP, TGA. Creating, Modifying & Transforming Standard primitives-All, Extended primitives-All. Creating objects using Key board entry, Naming the object.","mandatory":true},{"id":"T002","module":"3ds Max","name":"S2 · Selection, Transform & Clone - Waiting Hall","detail":"Creating a waiting hall by using clone option and co-ordinate systems: Selection methods: Selection Region with Window/Crossing, Select by Name window, Named and Edit selection set, Select by object window. Transforming Objects: Move, Rotate, Uniform & Non-uniform Scaling, Using Axis constraints(X,Y,Z), Transform type in Window. Reference Co-ordinate System (View, Local, Pick). Pivot Point: Use Pivot point center, Use Selection center, Use Transform Coordinate center. Clone Method: Copy option.","mandatory":true},{"id":"T003","module":"3ds Max","name":"S3 · Unit Setup, Grouping & Alignment - Auditorium","detail":"Creating an auditorium model: Unit Setup: System Unit Setup, Display Unit Scale. Group – Ungroup, Open, Close, Attach, Detach. Hierarchy (Affect Pivot Only, Affect Object only, Affect Hierarchy only, Center to Object, Align to Object, Align to World). Snap: 2D, 2.5D, 3D, Angular snap, Percent Snap. Utility tools: Align tool, Quick Align, Mirror, Array, Spacing tool, Clone and Align, Layer Manager.","mandatory":true},{"id":"T004","module":"3ds Max","name":"S4 · Parametric Deformers - Chair Model","detail":"Creating a Chair model: Modeling using Parametric Deformers (Modifiers): Bend, Taper, Twist, Relax, Skew, Stretch, Mirror. Selection Modifiers: Mesh select, Poly select, Patch select.","mandatory":true},{"id":"T005","module":"3ds Max","name":"S5 · Free Form Deformers - Pillow Model","detail":"Creating a Pillow model: Modeling using Free Form Deformers (Modifiers): FFD Box, FFD Cylinder, FFD2x2x2, FFD3x3x3, FFD4x4x4.","mandatory":true},{"id":"T006","module":"3ds Max","name":"S6 · Poly Modeling - King Size Sofa","detail":"Creating a King size sofa model: Poly Modeling Tools: Convert to editable poly, Edit Poly-Selection, Soft selection, Edit polygons, Edit geometry, Polygon properties, Paint deformation. Poly Modeling: Creating a Set model.","mandatory":true},{"id":"T007","module":"3ds Max","name":"S7 · Splines & Patch Modeling - Logo & Cushion Sofa","detail":"Creating a Logo model. Creating a Cushion sofa model. Shapes: Splines, Extended Splines. Edit Spline Modifier. Patch Modeling: Edit patch - Selection, Geometry, Surface properties. Patch Modeling using Shapes with 2D Snap, Edit spline modifier, Rendering, Interpolation, Selection, Soft selection, Geometry.","mandatory":true},{"id":"T008","module":"3ds Max","name":"S8 · AEC Objects & Compound Objects - Building with Trees","detail":"Creating a building model with trees and plants. Modeling the building using AEC Extended objects: Wall, Railing, Foliage, Stairs, Doors and Windows. Compound Objects: Boolean, Pro-Boolean (Scatter, Connect).","mandatory":true},{"id":"T009","module":"3ds Max","name":"S9 · 2D Modifiers & Path/Patch Deform - Fountain Source","detail":"Creating Fountain source model. 2D Modifiers: Extrude, Lathe (Bevel Profile, Bevel, Cap holes, Sweep). Animation Modifiers (Path deform (WSM), Patch deform (WSM)).","mandatory":true},{"id":"T010","module":"3ds Max","name":"S10 · Compound Objects & File Import - Cycle Model","detail":"Creating a Cycle model. Compound Object - Shape Merge, Loft, Deforming Loft objects: Scale, Twist & Teeter, Bevel. Importing ArchiCAD files, 3d AutoCAD files, Xref.","mandatory":true},{"id":"T011","module":"3ds Max","name":"S11 · Material Editor - Architectural Material","detail":"Creating an architectural material for the building model. Slate Material Editor and Compact Material Editor: Tools in material editors, Extended parameters, Saving Materials.","mandatory":true},{"id":"T012","module":"3ds Max","name":"S12 · Material Types & Maps","detail":"Creating a different types of materials to building model. Materials: Standard, Architectural, Multi/sub objects materials. Standard Material - Maps Rollout: Diffuse, Opacity, Raytrace, Bump, Reflection, Refraction.","mandatory":true},{"id":"T013","module":"3ds Max","name":"S13 · Compound Materials - Wall & Partition","detail":"Applying special material to Wall and partition wall objects. Compound Materials: Blend, Double sided, Top/Bottom, Shellac materials.","mandatory":true},{"id":"T014","module":"3ds Max","name":"S14 · Lighting - Interior & Exterior","detail":"Applying the light object to the building model interior and exterior. Standard Lights: Omni - General Parameters, Intensity/color/Attenuation, Advance effects, Shadow parameters, Shadow Map Parameters, Target & Free spot, Target & Free Direct, Sky light. Photometric lights: Target Light, Free Light, Exposure Controls, Templates, General Parameters, Shadows, Light Distribution, Intensity/Color/Attenuation, Light Shape.","mandatory":true},{"id":"T015","module":"3ds Max","name":"S15 · Particle Systems & Space Warps - Water Fountain","detail":"Creating Water Fountain. Particle systems: Spray, Snow, Super spray. Space warps: Forces, Path Follow, Wind, Motor, Gravity. Deflectors: Deflector, UDeflector, Sdeflector.","mandatory":true},{"id":"T016","module":"3ds Max","name":"S16 · Environment Effects - Fog, Water & Cloth","detail":"Creating Fog environment for the building model. Environment effects: Atmospheric effects, Bogizmo, Sphere Gizmo, CylGizmo, Fire – Fire Ball, Explosion, Tendril. Environment Effect: Volume Fog and Fog. Water Effect: Flex modifier, Attachment Constraint. Cloth Effect: Cloth Modifier.","mandatory":true},{"id":"T017","module":"3ds Max","name":"S17 · Cameras & Animation - Walkthrough","detail":"Creating a Perspective view and animation walkthrough using camera. Cameras: Target Camera & Free Camera. Animation: Introduction to Key frame Animation, Path Animation – Path Constraint. Graph Editors: Track view Dope Sheet, Track view Curve Editor.","mandatory":true},{"id":"T018","module":"3ds Max","name":"S18 · Advanced Rendering","detail":"Applying advanced rendering to get realistic effect for the building. Rendering: Scanline Rendering. Advanced Rendering: Quick Silver Hardware Rendering, Mentalray Rendering, Exposure Control, Advanced Lighting Dialog – Radiosity, Light Tracer, Advanced Lighting Override, Render to Texture, Iray rendering.","mandatory":true},{"id":"T019","module":"3ds Max","name":"S19 · File Handling, Video Post & Export Formats","detail":"Handling other max files and applying external filter effects. File Handling: Merging max files, Render AVI files file formats, Print Size Wizard - TIFF. Video post Filter Events: Lens Effects Glow, Lens Effects Highlight, Lens Effects Flare. Composite Multiple AVI files into a single Avi file. Export File formats - Obj, Iges, 3ds.","mandatory":true},{"id":"T020","module":"3ds Max","name":"S20 · Mini Project","detail":"Creating a mini project.","mandatory":true}]},{"id":"vray_max","name":"V-Ray for 3ds Max","category":"Visualisation","topics":[{"id":"T001","module":"V-Ray for 3ds Max","name":"S1 · Introduction & Rendering Engines","detail":"Ep.1 Introduction: Introduction to Vray, Highlights of Vray and understanding the Graphical user Interface, understanding the Vray Frame Buffer. Ep.2 Vray Rendering Engines: Understanding the Rendering, Understanding the Production Rendering mode and Real-Time Rendering Mode.","mandatory":true},{"id":"T002","module":"V-Ray for 3ds Max","name":"S2 · Image Sampling & Rendering Settings","detail":"Ep.3 Vray Image Sampling: Understanding the concept of Image sampling, Understanding the antialiasing quality and shading quality. Ep.4 Rendering Settings: Controlling the quality of Interior and Exterior renderings using Render Settings.","mandatory":true},{"id":"T003","module":"V-Ray for 3ds Max","name":"S3 · V-Ray Lights & Ambient Occlusion","detail":"Ep.5 V-Ray Lights: Introduction to Lighting concept, Understanding the Vray Area lights and its various types and options for interior renderings. Ep.6 Light Details with Ambient Occlusions: Vray Lights and 3ds Max Lights, Understanding the Vray Ambient Lights, Vray Dome Light and its various settings, Creation of Vray IES Light and its various settings, Understanding the Sun and Sky Light and its various settings for exterior renderings.","mandatory":true},{"id":"T004","module":"V-Ray for 3ds Max","name":"S4 · GI Renderings - Exterior & Interior","detail":"Ep.7 GI Renderings: Introduction to GI Concept, Understanding the various rendering engines for primary and secondary engines. Ep.8 GI for Exterior and Interior Scenes: Understanding the GI settings for Exterior Scenes using various rendering engines, Understanding the GI settings for Interior scenes using various rendering engines.","mandatory":true},{"id":"T005","module":"V-Ray for 3ds Max","name":"S5 · GI for Animation & Caustic Effects","detail":"Ep.8 GI for Quick Animation renderings: Concept of Caustics effects, Understanding the GI for Quick Animation renderings and its various options. Ep.9 Caustic Effects: Concept of Caustics effects, Understanding the Settings and options in Lights and render setup for Caustics effect and creation of caustics effects.","mandatory":true},{"id":"T006","module":"V-Ray for 3ds Max","name":"S6 · Vray Materials, Refraction & Bump Mapping","detail":"Ep.10 Vray Materials: Introduction to Vray Materials, Creation of Vray Materials, understanding the Diffuse and Roughness parameters in Vray Materials, Understanding the Reflection property of a material and its various settings & creation of reflective materials. Ep.11 Refraction, Translucent & Bump Mapping: understanding the refraction property of a material and creation of refractive materials and various settings, Understanding the Translucent Property and creating Translucent materials using its various options, Understanding the Bump and normal mapping, Creation of Textured Metals and Brushed Metals using Maps.","mandatory":true},{"id":"T007","module":"V-Ray for 3ds Max","name":"S7 · Vray Environment & Perspective Fog","detail":"Ep.12 Vray Environment: Understanding the Vray Environment Fog Effect and its various settings, Creation of Vray Environment Fog Perspective effect.","mandatory":true}]},{"id":"revit_a","name":"Revit - A","category":"BIM","topics":[{"id":"T001","module":"Revit - A","name":"S1 · Introduction to Revit Architecture & BIM","detail":"Introduction, About BIM, Introduction to Autodesk Revit Architecture, Revit File Types, Exploring User Interface, Building Elements, Starting a New Project.","mandatory":true},{"id":"T002","module":"Revit - A","name":"S2 · Drawing Plan, Levels, Grids & Walls","detail":"Drawing Plan as per Dimension, Drawing Aids, Project Units. Levels: Adding Levels, Modifying Levels, Creating Level Head, Constrain Levels. Grids. Walls: Create New Wall type, Location Line, Wall joins, Compound Wall. Practice: Let them prepare basic plan using above tools.","mandatory":true},{"id":"T003","module":"Revit - A","name":"S3 · Advanced Wall Modeling","detail":"More in Depth – Wall, Modify walls, Wall layer wrapping, Stacked wall, Vertically compound Wall, Wall shapes and Openings, Wall sweeps and Reveals, Construction Modeling Tools, Parts, Assemblies. Practice: Hands on.","mandatory":true},{"id":"T004","module":"Revit - A","name":"S4 · Modify Tools & Openings I","detail":"Modify Tools, Move, Copy, Create Similar, Rotate, Mirror, Array, Scale, Split Element, Trim, Align, Offset, Pin, Unpin, Doors, Windows, Keyboard Shortcuts. Practice: Hands on.","mandatory":true},{"id":"T005","module":"Revit - A","name":"S5 · Modify Tools & Openings II","detail":"Modify Tools, Move, Copy, Create Similar, Rotate, Mirror, Array, Scale, Split Element, Trim, Align, Offset, Pin, Unpin, Doors, Windows, Keyboard Shortcuts. Practice: Hands on.","mandatory":true},{"id":"T006","module":"Revit - A","name":"S6 · 3D Modeling - Floors & Ceilings","detail":"3D Modeling: Floor, Adding Floor, Sloped Floor, Floor Slab Edge, Ceiling, Create Ceiling, Components, Working with Modern Medium Library. Practice: Hands on.","mandatory":true},{"id":"T007","module":"Revit - A","name":"S7 · 3D Modeling - Roof & Openings","detail":"3D Modeling: Roof, Creating Roof, Modifying Roof, Shape editing for Roofs and Floors, Roof Soffit, Roof Fascia, Roof Gutter, Openings, Opening on face and Vertical Opening, Shaft opening, Dormer Opening. Practice: Hands on.","mandatory":true},{"id":"T008","module":"Revit - A","name":"S8 · Documentation - Dimensions & Constraints","detail":"Documentation: Dimensions, Temporary Dimensions, Permanent Dimensions, Modifying Dimensions, Constraints. Practice: Hands on.","mandatory":true},{"id":"T009","module":"Revit - A","name":"S9 · Managing Views","detail":"Managing Views: Creating views, Plan views, View range, Plan region, Elevation, Section, 3D Views, Lock 3D view, Background, Cropping View, Visibility or Graphics, View Templates, Duplicate Views, Visual Styles, Filter, Graphic Display Options. Practice: Han const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>t&&t.toDate?t.toDate().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kolkata'})+' IST':'—';
const ST={taught:['Awaiting student response','#B7791F'],submitted:['Pending faculty review','#2F7BFF'],disputed:['Disputed — investigate','#C0362C'],clarification:['Clarification requested','#6D4AC2'],revision:['Revision required','#6D4AC2'],approved:['Approved','#12805C'],rejected:['Rejected','#C0362C']};
const RESP={covered_ok:'Topics covered; no revision needed',covered_revision:'Topics covered; some revision required',not_covered:'Some topics were not covered',clarify:'I need clarification before confirming'};
const pill=s=>`<span class="pill" style="background:${ST[s][1]}">${ST[s][0]}</span>`;
const S={user:null,courses:[],sessions:[],users:[],notes:[],tab:'home',unsub:[]};
const LOGO=`<svg width="34" height="34" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 70 428 165v182L256 442 84 347V165Z" fill="none" stroke="#2F7BFF" stroke-width="30" stroke-linejoin="round"/><path d="M178 262l56 56 104-114" fill="none" stroke="#F5B301" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const course=id=>S.courses.find(c=>c.id===id)||{name:id,topics:[]};
const tname=(cid,tid)=>{const t=(course(cid).topics||[]).find(x=>x.id===tid);return t?t.name:tid};

/* ===== progress: unique topic IDs only; sessions never count by themselves ===== */
function prog(c,sess){const T=(c.topics||[]).filter(t=>t.mandatory!==false),n=T.length||1;
 const set=f=>new Set(sess.filter(s=>s.courseId===c.id&&f(s)).flatMap(s=>s.topicIds));
 const pc=X=>Math.round(T.filter(t=>X.has(t.id)).length/n*100);
 return{cov:pc(set(()=>true)),ack:pc(set(s=>s.ackAt&&['covered_ok','covered_revision'].includes(s.resp))),ver:pc(set(s=>s.status==='approved')),T}}
const bars=p=>[['Teaching coverage',p.cov,'#2F7BFF'],['Student acknowledgement',p.ack,'#F5B301'],['Faculty-verified',p.ver,'#12805C']].map(([l,v,c])=>`<div class="row"><span>${l}</span><b>${v}%</b></div><div class="bar"><i style="width:${v}%;background:${c}"></i></div>`).join('');

/* ===== audit helpers (batched with the state change so both succeed or both fail) ===== */
function ev(b,s,type,from,to,reason){b.set(db.collection('sessionEvents').doc(),{sessionId:s.id,studentUid:s.studentUid,facultyUid:s.facultyUid,type,from:from||null,to:to||null,reason:reason||null,actorUid:S.user.uid,actorRole:S.user.role,actorId:S.user.loginId,at:TS()})}
function nt(b,to,text,sid){b.set(db.collection('notifications').doc(),{toUid:to,text,sessionId:sid,read:false,at:TS()})}

/* ===== auth ===== */
function showLogin(m){S.unsub.forEach(f=>f());S.unsub=[];const R=ROLE[0].toUpperCase()+ROLE.slice(1);
 $('#app').innerHTML=`<div id="login"><section class="hero">${cadSvg('#7FB0FF','.55',true)}<div class="hero-in">${LOGO.replace('width="34" height="34"','width="64" height="64"')}<h1>CADTrack 360</h1><p class="by">by 10XCADD</p><p class="tag">Every Session. Every Topic. Verified.</p><div class="chips"><span>Session record</span><span>Student response</span><span>Faculty approval</span></div></div></section>
 <section class="formside"><form class="card lf" id="lf"><h2>${R} sign in</h2><p class="sub">Use the ID and password sent to you.</p><label for="id">ID</label><input id="id" autocomplete="username" required>
 <label for="pw">Password</label><div style="display:flex;gap:6px"><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="btn alt" id="eye" aria-label="Show or hide password">Show</button></div>
 <div class="err" id="er" role="alert">${esc(m||'')}</div><button class="btn" style="width:100%" id="go">Sign in</button><p style="text-align:center;margin:14px 0 0"><a href="#" id="fp">Forgot password?</a></p></form></section></div>`;
 $('#fp').onclick=e=>{e.preventDefault();forgot()};
 $('#eye').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password';$('#eye').textContent=p.type==='password'?'Show':'Hide'};
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;$('#go').textContent='Signing in…';try{await auth.signInWithEmailAndPassword(authEmail($('#id').value.trim().toLowerCase()),$('#pw').value)}catch(x){$('#er').textContent='Wrong ID or password.';$('#go').disabled=false;$('#go').textContent='Sign in'}}}
auth.onAuthStateChanged(async u=>{
 if(!u){S.user=null;const m=S.flash;S.flash='';return showLogin(m)}
 let d;try{d=await db.doc('users/'+u.uid).get()}catch(e){S.flash=e.code==='permission-denied'?'Signed in, but the database refused access. Admin: publish firebase/firestore.rules in Firebase (Firestore > Rules) and make sure a users document exists with ID '+u.uid+'.':'Could not load your profile ('+(e.code||e.message)+'). Check your connection and try again.';return auth.signOut()}
 if(!d.exists){S.flash='Signed in, but no profile exists for this login. Admin: create Firestore users/'+u.uid;return auth.signOut()}
 const p=d.data();if(p.status!=='active'){S.flash='This account is suspended. Contact the administrator.';return auth.signOut()}
 if(p.role!==ROLE){S.flash='This is the '+ROLE+' portal. Please use the link meant for your role.';return auth.signOut()}
 S.user={uid:u.uid,...p};
 try{start()}catch(e){console.error(e);S.err=e.message;try{render()}catch(x){}}});

function start(){const u=S.user,sc=db.collection('sessions');S.tab='home';S.err='';S.unsub.forEach(f=>f());
 const q=u.role==='admin'?sc.limit(1000):sc.where(u.role==='student'?'studentUid':'facultyUid','==',u.uid),er=e=>{console.error(e);S.err='Some data could not be loaded ('+(e.code||e.message)+'). Check the published Firestore rules.';render()};
 S.unsub=[db.collection('courses').onSnapshot(s=>{S.courses=s.docs.map(d=>({id:d.id,...d.data()}));render()},er),
  q.onSnapshot(s=>{S.sessions=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9));render()},er),
  db.collection('notifications').where('toUid','==',u.uid).onSnapshot(s=>{S.notes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at?.seconds||9e9)-(a.at?.seconds||9e9));render()},er)];
 const us=s=>{S.users=s.docs.map(d=>({uid:d.id,...d.data()}));render()};
 if(u.role==='admin'){S.unsub.push(db.collection('users').onSnapshot(us,er),db.collection('adminLogs').limit(300).onSnapshot(s=>{S.logs=s.docs.map(d=>d.data()).sort((a,b)=>(b.at?.seconds||9e9)-(a.at?.seconds||9e9));render()},er))}
 if(u.role==='faculty')S.unsub.push(db.collection('users').where('facultyUids','array-contains',u.uid).onSnapshot(us,er));
 render();if(u.mustChange===true)forceChange()}

function forgot(){open(`<h3>Forgot password</h3><p>Enter your ID. Your administrator will get a reset link, set a new password and message it to you.</p><label>Your ID</label><input id="fi" autocomplete="username"><div class="err" id="fe" role="alert"></div><div class="dact"><button class="btn alt" data-a="close">Cancel</button><button class="btn" id="fs">Request reset</button></div>`);
 $('#fs').onclick=async()=>{const v=$('#fi').value.trim().toLowerCase();if(!v)return $('#fe').textContent='Enter your ID.';try{await auth.sendPasswordResetEmail(authEmail(v));$('#fe').style.color='var(--ok)';$('#fe').textContent='Request sent. Your administrator will message you a new password.'}catch(x){$('#fe').style.color='var(--bad)';$('#fe').textContent='Could not send the request. Check your ID and try again.'}}}
function forceChange(){open(`<h3>Set your own password</h3><p>For your security, choose a new password before you continue.</p><label>New password (min 8 characters)</label><input id="p1" type="password" autocomplete="new-password"><label>Repeat password</label><input id="p2" type="password" autocomplete="new-password"><div class="err" id="pe" role="alert"></div><button class="btn" id="ps">Save password</button>`);dlg.oncancel=e=>e.preventDefault();
 $('#ps').onclick=async()=>{const a=$('#p1').value,b=$('#p2').value,m=$('#pe');if(a.length<8)return m.textContent='Use at least 8 characters.';if(a!==b)return m.textContent='The two passwords do not match.';if(/^[A-Za-z]+@\d+$/.test(a))return m.textContent='Choose something different from name@number.';try{await auth.currentUser.updatePassword(a);await db.doc('users/'+S.user.uid).update({mustChange:false});S.user.mustChange=false;dlg.oncancel=null;close()}catch(x){m.textContent='Could not save. Sign out, sign in again and retry.'}}}

/* ===== shell ===== */
const TABS={student:[['home','My courses'],['sessions','Sessions']],faculty:[['home','Review queue'],['record','Record session'],['sessions','All sessions'],['progress','Student progress']],admin:[['home','Overview'],['students','Students'],['faculty','Faculty'],['courses','Courses'],['sessions','Session register'],['ratings','Ratings'],['audit','Audit log']]};
const badge=s=>`<span class="pill" style="background:${{active:'#0F9D6E',completed:'#2F7BFF',suspended:'#D6453B'}[s]||'#5E6B82'}">${s}</span>`;
const rowFilter=()=>{const q=($('#uq')&&$('#uq').value||'').toLowerCase(),f=$('#uf')&&$('#uf').value||'';document.querySelectorAll('#ut tr[data-r]').forEach(r=>{r.style.display=(r.textContent.toLowerCase().includes(q)&&(!f||r.dataset.st===f))?'':'none'})};
function render(){const u=S.user;if(!u)return;const unread=S.notes.filter(n=>!n.read).length,keep=[$('#uq')&&$('#uq').value,$('#uf')&&$('#uf').value];
 $('#app').innerHTML=`<header class="top"><div class="brand">${LOGO}<div><b>CADTrack 360</b><small>by 10XCADD</small></div></div><span class="sp"></span><div class="who"><b>${esc(u.name)}</b><small>${esc(u.loginId)} · ${u.role}</small></div>
 <button class="btn alt sm ib" data-a="bell" aria-label="Notifications">Alerts${unread?`<i>${unread}</i>`:''}</button><button class="btn alt sm" data-a="pw">Password</button><button class="btn alt sm" data-a="out">Log out</button></header>
 <nav class="tabs">${TABS[u.role].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</nav><main>${S.err?`<div class="note bad">${esc(S.err)}</div>`:''}${VIEW[u.role][S.tab]()}</main>`;
 if($('#uq')&&keep[0]!=null){$('#uq').value=keep[0];$('#uf').value=keep[1]||'';rowFilter()}}
const sessCard=(s,acts)=>`<div class="card"><div class="row"><b style="color:var(--ink)">${esc(s.title)}</b>${pill(s.status)}</div>
 <div style="font-size:14px;margin:6px 0">${esc(course(s.courseId).name)} · Trained on ${esc(s.date)} by ${esc(s.facultyName)}${S.user.role!=='student'?' · '+esc(s.studentName)+' ('+esc(s.studentId)+')':''}</div>
 <div style="font-size:14px">${s.topicIds.map(t=>'• '+esc(tname(s.courseId,t))).join('<br>')}</div>
 ${s.ackAt?`<div class="note" style="margin-top:8px">Response ${fmt(s.ackAt)} · ${'★'.repeat(s.rating)} · ${esc(RESP[s.resp])}${s.comment?'<br>'+esc(s.comment):''}</div>`:''}
 ${s.reviewNote?`<div class="note" style="margin-top:8px">Faculty note (${fmt(s.reviewedAt)}): ${esc(s.reviewNote)}</div>`:''}
 <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${acts}<button class="btn alt sm" data-a="hist" data-v="${s.id}">History</button></div></div>`;
const list=(arr,f)=>arr.length?arr.map(f).join(''):'<div class="empty">Nothing here yet.</div>';
const filt=(k)=>`<select data-a="flt" data-k="${k}" aria-label="Filter by status"><option value="">All statuses</option>${Object.keys(ST).map(s=>`<option value="${s}" ${S[k]===s?'selected':''}>${ST[s][0]}</option>`).join('')}</select>`;
const fl=(k,arr)=>S[k]?arr.filter(s=>s.status===S[k]):arr;

const VIEW={
student:{
 home(){const u=S.user,cs=(u.courses||[]).map(course),todo=S.sessions.filter(s=>['taught','clarification'].includes(s.status));
  return `<div class="hello"><h2>Welcome, ${esc(u.name.split(' ')[0])}</h2><p>${esc(u.loginId)} · your learning record</p></div>${todo.length?`<div class="note"><b>${todo.length} session(s) need your response.</b> Open Sessions to review and acknowledge.</div>`:''}<div class="grid">${cs.map(c=>{const p=prog(c,S.sessions),dn=(u.completed||{})[c.id],f=(u.enrol||{})[c.id];
  return `<div class="card"><div class="row"><h3>${esc(c.name)}</h3>${dn?'<span class="pill" style="background:#2F7BFF">Completed</span>':''}</div><div class="sub">Faculty: ${esc(f?f.name:'—')}</div>${bars(p)}<details><summary>Syllabus topics (${p.T.length})</summary>${p.T.map(t=>{const ss=S.sessions.filter(s=>s.courseId===c.id&&s.topicIds.includes(t.id)),st=ss.some(s=>s.status==='approved')?'✔ Approved':ss.some(s=>s.status==='disputed')?'⚠ Disputed':ss.some(s=>['revision','clarification'].includes(s.status))?'↻ Needs revision':ss.some(s=>s.ackAt)?'… Under review':ss.length?'Taught':'Not yet taught';return `<div style="padding:5px 0"><div class="row"><span>${esc(t.name)}</span><span>${st}</span></div>${t.detail?`<div style="font-size:12px;color:var(--mute)">${esc(t.detail)}</div>`:''}</div>`}).join('')}</details><div class="note" style="margin:10px 0 0">Acknowledging a session is not approval. Verified progress rises only after faculty approval.</div></div>`}).join('')||'<div class="empty">No courses assigned yet.</div>'}</div>`},
 sessions(){return `<h2>Your sessions</h2>${filt('f1')}${list(fl('f1',S.sessions),s=>sessCard(s,['taught','clarification'].includes(s.status)?`<button class="btn" data-a="ack" data-v="${s.id}">Review and Acknowledge Session</button>`:''))}`}},
faculty:{
 home(){const q=S.sessions.filter(s=>['submitted','disputed'].includes(s.status));
  return `<h2>Awaiting your review (${q.length})</h2>${list(q,s=>sessCard(s,`<button class="btn" data-a="rev" data-v="${s.id}">Review response</button>`))}`},
 record(){const cs=(S.user.courses||[]).map(course);
  return `<h2>Record a training session</h2><form class="card" id="rf"><label>Course</label><select id="rc">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
  <label>Session title</label><input id="rt" required><label>Training date (actual)</label><input id="rd" type="date" required max="${new Date().toISOString().slice(0,10)}">
  <div id="rx"></div><label>Learning notes (optional)</label><textarea id="rn" rows="2"></textarea><button class="btn">Record session</button><p class="note" style="margin-top:12px">Recording a session does not approve it. Each student must respond, then you review.</p></form>`},
 sessions(){return `<h2>All sessions</h2>${filt('f2')}${list(fl('f2',S.sessions),s=>sessCard(s,''))}`},
 progress(){const rows=[];S.users.filter(u=>u.role==='student').forEach(st=>(st.courses||[]).filter(c=>st.enrol&&st.enrol[c]&&st.enrol[c].uid===S.user.uid).forEach(cid=>{const p=prog(course(cid),S.sessions.filter(s=>s.studentUid===st.uid));rows.push(`<tr><td><b>${esc(st.name)}</b><br><small>${esc(st.loginId)}</small></td><td>${esc(course(cid).name)}${(st.completed||{})[cid]?' ✔':''}</td><td>${p.cov}%</td><td>${p.ack}%</td><td><b>${p.ver}%</b></td></tr>`)}));
  return `<h2>Student progress</h2><div class="card tw"><table><tr><th>Student</th><th>Course</th><th>Taught</th><th>Acknowledged</th><th>Verified</th></tr>${rows.join('')||'<tr><td colspan=5 class="empty">No students assigned to you yet.</td></tr>'}</table></div>`}},
admin:{
 home(){const A=S.users.filter(u=>u.status==='active'),c=s=>S.sessions.filter(x=>x.status===s).length,st=S.users.filter(u=>u.role==='student'),dn=st.filter(u=>(u.courses||[]).length&&(u.courses||[]).every(x=>(u.completed||{})[x])).length;
  const k=[['Active students',A.filter(u=>u.role==='student').length-dn],['Completed students',dn],['Active faculty',A.filter(u=>u.role==='faculty').length],['Courses',S.courses.length],['Awaiting student',c('taught')],['Awaiting faculty',c('submitted')],['Disputed',c('disputed')],['Approved sessions',c('approved')]];
  const stale=S.courses.filter(co=>{const l=S.sessions.filter(s=>s.courseId===co.id)[0];return S.users.some(u=>u.role==='student'&&(u.courses||[]).includes(co.id))&&(!l||(Date.now()/1000-(l.createdAt?.seconds||0))>14*86400)});
  return `<div class="hello"><h2>Overview</h2></div><div class="grid">${k.map(([l,v])=>`<div class="card stat"><span>${l}</span><b>${v}</b></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Stalled courses (students enrolled, no session in 14 days)</h3>${stale.map(x=>esc(x.name)).join(', ')||'None'}</div>`},
 students(){const st=S.users.filter(u=>u.role==='student');
  return `<h2>Students</h2><div class="toolbar"><button class="btn" data-a="adds">+ Add student</button><input id="uq" placeholder="Search name or ID"><select id="uf"><option value="">All</option><option value="active">Active</option><option value="completed">Completed</option><option value="suspended">Suspended</option></select></div><div class="card tw"><table id="ut"><tr><th>Student</th><th>Software and faculty</th><th>Verified</th><th>Status</th><th></th></tr>${st.map(u=>{const cs=u.courses||[],dn=u.completed||{},ss=S.sessions.filter(s=>s.studentUid===u.uid),stt=u.status==='suspended'?'suspended':(cs.length&&cs.every(c=>dn[c]))?'completed':'active';
   return `<tr data-r data-st="${stt}"><td><b>${esc(u.name)}</b><br><small>${esc(u.loginId)} · ${esc(u.phone||'')}</small></td><td>${cs.map(c=>`${esc(course(c).name)} <small>(${esc((u.enrol&&u.enrol[c]&&u.enrol[c].name)||'no faculty')})${dn[c]?' ✔':''}</small>`).join('<br>')}</td><td>${cs.map(c=>prog(course(c),ss).ver+'%').join('<br>')}</td><td>${badge(stt)}</td><td class="acts"><button class="btn alt sm" data-a="edt" data-v="${u.uid}">Edit</button><button class="btn alt sm" data-a="cmp" data-v="${u.uid}">Completion</button><button class="btn alt sm" data-a="rst" data-v="${u.uid}">Reset password</button><button class="btn alt sm" data-a="msg" data-v="${u.uid}">Message</button><button class="btn alt sm" data-a="tog" data-v="${u.uid}">${u.status==='active'?'Suspend':'Activate'}</button><button class="btn alt sm" data-a="del" data-v="${u.uid}">Delete</button></td></tr>`}).join('')||'<tr><td colspan=5 class="empty">No students yet. Press + Add student.</td></tr>'}</table></div>`},
 faculty(){const fa=S.users.filter(u=>u.role==='faculty');
  return `<h2>Faculty</h2><div class="toolbar"><button class="btn" data-a="addf">+ Add faculty</button><input id="uq" placeholder="Search name or ID"><select id="uf"><option value="">All</option><option value="active">Active</option><option value="suspended">Suspended</option></select></div><div class="card tw"><table id="ut"><tr><th>Faculty</th><th>Software taught</th><th>Students</th><th>Status</th><th></th></tr>${fa.map(u=>{const n=S.users.filter(s=>s.role==='student'&&(s.facultyUids||[]).includes(u.uid)).length;
   return `<tr data-r data-st="${u.status}"><td><b>${esc(u.name)}</b><br><small>${esc(u.loginId)} · ${esc(u.phone||'')}</small></td><td>${(u.courses||[]).map(c=>esc(course(c).name)).join('<br>')||'—'}</td><td>${n}</td><td>${badge(u.status)}</td><td class="acts"><button class="btn alt sm" data-a="edt" data-v="${u.uid}">Edit</button><button class="btn alt sm" data-a="rst" data-v="${u.uid}">Reset password</button><button class="btn alt sm" data-a="msg" data-v="${u.uid}">Message</button><button class="btn alt sm" data-a="tog" data-v="${u.uid}">${u.status==='active'?'Suspend':'Activate'}</button><button class="btn alt sm" data-a="del" data-v="${u.uid}">Delete</button></td></tr>`}).join('')||'<tr><td colspan=5 class="empty">No faculty yet. Press + Add faculty.</td></tr>'}</table></div>`},
 courses(){return `<h2>Courses and syllabus</h2><div class="toolbar"><button class="btn" data-a="newc">Create course / import syllabus</button><button class="btn alt" data-a="seed">Load institute syllabus (10 courses)</button></div>${S.courses.map(c=>`<div class="card"><h3>${esc(c.name)} <small style="color:var(--mute)">${esc(c.category)} · v${c.version||1}</small></h3><details><summary>${(c.topics||[]).length} topics</summary>${(c.topics||[]).map(t=>`<div style="font-size:14px;padding:3px 0">${esc(t.name)} ${t.mandatory===false?'<i>(optional)</i>':''}${t.detail?`<div style="font-size:12px;color:var(--mute)">${esc(t.detail)}</div>`:''}</div>`).join('')}</details></div>`).join('')||'<div class="empty">No courses yet. Press Load institute syllabus.</div>'}`},
 sessions(){return `<h2>Session register</h2><div class="toolbar">${filt('f3')} <button class="btn alt sm" data-a="csv">Export CSV</button></div>${list(fl('f3',S.sessions),s=>sessCard(s,s.status!=='taught'?`<button class="btn rev sm" data-a="reopen" data-v="${s.id}">Reopen with reason</button>`:''))}`},
 ratings(){const now=Date.now()/1000,d=30*86400,avg=a=>a.length?(a.reduce((x,s)=>x+s.rating,0)/a.length).toFixed(2):'—';
  const rows=S.users.filter(u=>u.role==='faculty').map(f=>{const r=S.sessions.filter(s=>s.facultyUid===f.uid&&s.rating&&s.ackAt&&s.ackAt.seconds),cur=r.filter(s=>now-s.ackAt.seconds<=d),prev=r.filter(s=>{const a=now-s.ackAt.seconds;return a>d&&a<=2*d});

async function createUser(role,name,phone,cs,enrol,fu,adm){const first=name.split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,'');if(!first)throw new Error('The name must contain letters a to z.');

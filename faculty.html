<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CADTrack 360 · faculty</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><meta name="theme-color" content="#0B1F44">
<style>
:root{--navy:#0A1B3F;--navy2:#12306B;--blue:#2F7BFF;--gold:#F5B301;--ink:#10213F;--mute:#5E6B82;--line:#DCE3EF;--ok:#0F9D6E;--bad:#D6453B;--rev:#7B54D6}
*{box-sizing:border-box}html{background:#E9EFF8}
body{margin:0;font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:var(--cad) 0 0/900px 700px repeat,linear-gradient(180deg,#F1F5FC,#E2EAF6);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:linear-gradient(120deg,rgba(10,27,63,.97),rgba(18,48,107,.97));color:#fff;border-bottom:2px solid var(--gold);box-shadow:0 10px 28px -12px rgba(10,27,63,.7)}
.brand{display:flex;gap:10px;align-items:center}.brand b{font-size:17px}.brand small,.who small{display:block;color:#9FB7E6;font-size:11px}
.who{text-align:right;line-height:1.25;font-size:13px}.sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 20px 0;max-width:1140px;margin:0 auto}
.tabs button{border:0;background:rgba(255,255,255,.65);padding:10px 16px;border-radius:12px 12px 0 0;color:var(--mute);font-weight:600;white-space:nowrap;min-height:44px}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
main{max-width:1140px;margin:0 auto;padding:18px 20px 48px}
h2{margin:2px 0 14px;font-size:22px;letter-spacing:-.2px}h3{margin:0 0 8px;font-size:16px}
.card{background:#fff;border:1px solid rgba(220,227,239,.9);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 14px 32px -20px rgba(10,27,63,.45)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.grid .card{margin:0}
.stat{background:linear-gradient(150deg,#fff,#F3F7FF)}.stat b{font-size:30px;display:block;color:var(--navy)}.stat span{color:var(--mute);font-size:13px}
.btn{background:linear-gradient(135deg,#3B86FF,#2563EB);color:#fff;border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;box-shadow:0 8px 16px -10px #2563EB}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.rev{background:var(--rev)}.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}.top .btn.alt{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.ib{position:relative}.ib i{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#000;border-radius:99px;font-size:11px;font-style:normal;padding:1px 6px;font-weight:700}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 12px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #9DC1FF;border-color:var(--blue)}
label{font-size:13px;color:var(--mute);font-weight:600}label.c{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;font-weight:500;margin:6px 0}label.c input{width:auto;margin:3px 0}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.bar{height:9px;background:#E4EAF5;border-radius:6px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%;border-radius:6px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);align-items:center}.sub{font-size:13px;color:var(--mute);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tw{overflow-x:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{width:auto;min-width:200px;margin:0}
.acts{display:flex;gap:5px;flex-wrap:wrap;min-width:230px}.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}.crow select{margin:0}.plist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:4px 0 10px}
dialog{border:0;border-radius:18px;padding:20px;width:min(580px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(10,27,63,.6)}dialog::backdrop{background:rgba(10,27,63,.6);backdrop-filter:blur(3px)}
.stars{display:flex;gap:6px;flex-wrap:wrap}.stars label{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;color:var(--ink);cursor:pointer}
.stars input{position:absolute;opacity:0}.stars label:has(input:checked){background:var(--gold);border-color:var(--gold);font-weight:700}.stars label:has(input:focus-visible){outline:2px solid var(--blue)}
.err{color:var(--bad);font-size:14px;min-height:20px}.empty{color:var(--mute);text-align:center;padding:28px}
.note{background:#FFF8E0;border:1px solid #F1DC96;border-radius:10px;padding:11px;font-size:13px;margin-bottom:12px}.note.bad{background:#FDECEA;border-color:#F3B8B2}
.hello p{margin:-8px 0 14px;color:var(--mute)}
#net{background:var(--bad);color:#fff;text-align:center;font-size:13px;padding:4px;display:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#login{display:grid;grid-template-columns:1.15fr .85fr;min-height:100vh}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 25% 15%,#1B4DA3,#0A1B3F 62%);color:#fff;display:flex;align-items:center;padding:56px}
.hero svg.cad{position:absolute;inset:0;width:100%;height:100%}.hero-in{position:relative;z-index:1;max-width:460px}
.hero h1{font-size:44px;margin:14px 0 0;letter-spacing:-1px}.hero .by{color:#9FB7E6;margin:2px 0 18px}.hero .tag{font-size:20px;color:var(--gold);font-weight:700;margin:0 0 22px}
.chips span{display:inline-block;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 14px;margin:0 8px 8px 0;font-size:13px;background:rgba(255,255,255,.07)}
.formside{display:flex;align-items:center;justify-content:center;padding:24px}.lf{width:min(400px,100%);padding:26px}.lf h2{margin-bottom:4px}
.dr{stroke-dasharray:1600;stroke-dashoffset:1600;animation:dr 7s ease-in-out infinite alternate}@keyframes dr{to{stroke-dashoffset:0}}
@media(max-width:820px){#login{grid-template-columns:1fr}.hero{padding:26px;min-height:240px}.hero h1{font-size:30px}.hero .tag{font-size:16px}.chips{display:none}.who{display:none}.crow{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.dr{animation:none;stroke-dashoffset:0}}
</style></head><body>
<div id="net">Offline — official submissions need a connection. Drafts stay on this device only.</div>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const ROLE='faculty';const SEED=[];
const authEmail=v=>v.includes('@')?v:MAILBASE.user+'+'+v+'@'+MAILBASE.domain; // IDs are aliases of the admin mailbox, so reset emails reach the admin
const credMsg=(role,name,id,pw,reset,extra)=>`Hello ${name},\n\n`+(reset?'Your CADTrack 360 password has been reset.':`Your CADTrack 360 by 10XCADD ${role} account is ready.`)+`\n\nLogin ID: ${id}\n`+(pw?`Password: ${pw}\n`:'')+`Link: ${LINKS[role]}\n`+(extra?extra+'\n':'')+`\n`+(role==='student'?'After each class, open the app, review the session and send your rating and feedback.':"Record each session you teach, then review your students' responses.")+`\n\nPlease set your own password when asked at first login. Forgot your password? Tap "Forgot password?" on the login page and your administrator will send a new one.`;
firebase.initializeApp(CFG);
const cadSvg=(c,o,an)=>{const k=an?' class="dr"':'';return `<svg xmlns="http://www.w3.org/2000/svg" class="cad" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice" fill="none" stroke="${c}" stroke-width="1.4"><defs><pattern id="g1" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke-opacity=".08"/></pattern><pattern id="g2" width="150" height="150" patternUnits="userSpaceOnUse"><path d="M150 0H0V150" stroke-opacity=".16"/></pattern></defs><rect width="900" height="700" fill="url(#g1)" stroke="none"/><rect width="900" height="700" fill="url(#g2)" stroke="none"/><g stroke-opacity="${o}"><circle${k} cx="170" cy="150" r="72"/><circle${k} cx="170" cy="150" r="30"/><path${k} d="M70 150H270M170 50V250" stroke-dasharray="16 4 3 4"/><rect${k} x="520" y="80" width="230" height="140"/><rect${k} x="560" y="112" width="150" height="76"/><path${k} d="M520 252H750M520 244V260M750 244V260M786 80V220M778 80H794M778 220H794"/><path${k} d="M600 470l90-52 90 52v104l-90 52-90-52z"/><path${k} d="M600 470l90 52 90-52M690 522v104"/><path${k} d="M110 560a130 130 0 0 1 220-95"/><path${k} d="M110 560H340M110 560l60-70" stroke-dasharray="6 5"/><path${k} d="M420 330l30-14 30 14 14 30-14 30-30 14-30-14-14-30z"/><circle${k} cx="450" cy="360" r="16"/><path${k} d="M300 330L470 240M300 322v16M470 232v16" stroke-dasharray="8 3"/></g></svg>`};
document.documentElement.style.setProperty('--cad','url("data:image/svg+xml,'+encodeURIComponent(cadSvg('#1E4FBF','.30',false).replace(' class="cad"',''))+'")');

const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>t&&t.toDate?t.toDate().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kolkata'})+' IST':'—';
const ST={taught:['Awaiting student response','#B7791F'],submitted:['Pending faculty review','#2F7BFF'],disputed:['Disputed — investigate','#C0362C'],clarification:['Clarification requested','#6D4AC2'],revision:['Revision required','#6D4AC2'],approved:['Approved','#12805C'],rejected:['Rejected','#C0362C']};
const RESP={covered_ok:'Topics covered; no revision needed',covered_revision:'Topics covered; some revision required',not_covered:'Some topics were not covered',clarify:'I need clarification before confirming'};
const pill=s=>`<span class="pill" style="background:${ST[s][1]}">${ST[s][0]}</span>`;
const TR=(()=>{try{return JSON.parse(sessionStorage.getItem('ct360t')||'[]')}catch(e){return[]}})();
const tr=x=>{TR.push(new Date().toLocaleTimeString('en-IN')+' '+x);if(TR.length>16)TR.shift();try{sessionStorage.setItem('ct360t',JSON.stringify(TR))}catch(e){}};
tr('page load '+location.pathname.split('/').pop()+' ('+(((performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{}).type||'?')+')');
addEventListener('error',e=>tr('JS error: '+e.message));addEventListener('unhandledrejection',e=>tr('promise error: '+((e.reason&&(e.reason.code||e.reason.message))||e.reason)));
const S={user:null,courses:[],sessions:[],users:[],notes:[],tab:'home',unsub:[]};
const LOGO=`<svg width="34" height="34" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 70 428 165v182L256 442 84 347V165Z" fill="none" stroke="#2F7BFF" stroke-width="30" stroke-linejoin="round"/><path d="M178 262l56 56 104-114" fill="none" stroke="#F5B301" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const course=id=>S.courses.find(c=>c.id===id)||{name:id,topics:[]};
const tname=(cid,tid)=>{const t=(course(cid).topics||[]).find(x=>x.id===tid);return t?t.name:tid};

/* ===== progress: unique topic IDs only; sessions never count by themselves ===== */
function prog(c,sess){const T=(c.topics||[]).filter(t=>t.mandatory!==false),n=T.length||1;
 const set=f=>new Set(sess.filter(s=>s.courseId===c.id&&f(s)).flatMap(s=>s.topicIds));
 const pc=X=>Math.round(T.filter(t=>X.has(t.id)).length/n*100);
 return{cov:pc(set(()=>true)),ack:pc(set(s=>s.ackAt&&['covered_ok','covered_revision'].includes(s.resp))),ver:pc(set(s=>s.status==='approved')),T}}
const bars=p=>[['Teaching coverage',p.cov,'#2F7BFF'],['Student acknowledgement',p.ack,'#F5B301'],['Faculty-verified',p.ver,'#12805C']].map(([l,v,c])=>`<div class="row"><span>${l}</span><b>${v}%</b></div><div class="bar"><i style="width:${v}%;background:${c}"></i></div>`).join('');

/* ===== audit helpers (batched with the state change so both succeed or both fail) ===== */
function ev(b,s,type,from,to,reason){b.set(db.collection('sessionEvents').doc(),{sessionId:s.id,studentUid:s.studentUid,facultyUid:s.facultyUid,type,from:from||null,to:to||null,reason:reason||null,actorUid:S.user.uid,actorRole:S.user.role,actorId:S.user.loginId,at:TS()})}
function nt(b,to,text,sid){b.set(db.collection('notifications').doc(),{toUid:to,text,sessionId:sid,read:false,at:TS()})}

/* ===== auth ===== */
function showLogin(m){tr('login page shown'+(m?': '+m:''));S.unsub.forEach(f=>f());S.unsub=[];const R=ROLE[0].toUpperCase()+ROLE.slice(1);
 $('#app').innerHTML=`<div id="login"><section class="hero">${cadSvg('#7FB0FF','.55',true)}<div class="hero-in">${LOGO.replace('width="34" height="34"','width="64" height="64"')}<h1>CADTrack 360</h1><p class="by">by 10XCADD</p><p class="tag">Every Session. Every Topic. Verified.</p><div class="chips"><span>Session record</span><span>Student response</span><span>Faculty approval</span></div></div></section>
 <section class="formside"><form class="card lf" id="lf"><h2>${R} sign in</h2><p class="sub">Use the ID and password sent to you.</p><label for="id">ID</label><input id="id" autocomplete="username" required>
 <label for="pw">Password</label><div style="display:flex;gap:6px"><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="btn alt" id="eye" aria-label="Show or hide password">Show</button></div>
 <div class="err" id="er" role="alert">${esc(m||'')}</div><button class="btn" style="width:100%" id="go">Sign in</button><p style="text-align:center;margin:14px 0 0"><a href="#" id="fp">Forgot password?</a></p><details style="margin-top:14px;font-size:12px;color:var(--mute)"><summary>Having trouble? Show diagnostic trail</summary><pre style="white-space:pre-wrap;margin:6px 0 0">${esc(TR.join("\n"))}</pre></details></form></section></div>`;
 $('#fp').onclick=e=>{e.preventDefault();forgot()};
 $('#eye').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password';$('#eye').textContent=p.type==='password'?'Show':'Hide'};
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;$('#go').textContent='Signing in…';try{await auth.signInWithEmailAndPassword(authEmail($('#id').value.trim().toLowerCase()),$('#pw').value)}catch(x){$('#er').textContent='Wrong ID or password.';$('#go').disabled=false;$('#go').textContent='Sign in'}}}
auth.onAuthStateChanged(async u=>{
 tr('auth state: '+(u?'signed in':'signed out'));if(!u){S.user=null;const m=S.flash;S.flash='';return showLogin(m)}
 let d;try{d=await db.doc('users/'+u.uid).get()}catch(e){tr('profile read failed: '+(e.code||e.message));S.flash=e.code==='permission-denied'?'Signed in, but the database refused access. Admin: publish firebase/firestore.rules in Firebase (Firestore > Rules) and make sure a users document exists with ID '+u.uid+'.':'Could not load your profile ('+(e.code||e.message)+'). Check your connection and try again.';return auth.signOut()}
 if(!d.exists){S.flash='Signed in, but no profile exists for this login. Admin: create Firestore users/'+u.uid;return auth.signOut()}
 const p=d.data();if(p.status!=='active'){S.flash='This account is suspended. Contact the administrator.';return auth.signOut()}
 if(p.role!==ROLE){S.flash='This is the '+ROLE+' portal. Please use the link meant for your role.';return auth.signOut()}
 tr('profile ok, role '+p.role);S.user={uid:u.uid,...p};
 try{start();tr('app started')}catch(e){tr('start failed: '+e.message);console.error(e);S.err=e.message;try{render()}catch(x){}}});

function start(){const u=S.user,sc=db.collection('sessions');S.tab='home';S.err='';S.unsub.forEach(f=>f());
 const q=u.role==='admin'?sc.limit(1000):sc.where(u.role==='student'?'studentUid':'facultyUid','==',u.uid),er=e=>{console.error(e);S.err='Some data could not be loaded ('+(e.code||e.message)+'). Check the published Firestore rules.';render()};
 S.unsub=[db.collection('courses').onSnapshot(s=>{S.courses=s.docs.map(d=>({id:d.id,...d.data()}));render()},er),
  q.onSnapshot(s=>{S.sessions=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9));render()},er),
  db.collection('notifications').where('toUid','==',u.uid).onSnapshot(s=>{S.notes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at?.seconds||9e9)-(a.at?.seconds||9e9));render()},er)];
 const us=s=>{S.users=s.docs.map(d=>({uid:d.id,...d.data()}));render()};
 if(u.role==='admin'){S.unsub.push(db.collection('users').onSnapshot(us,er),db.collection('adminLogs').limit(300).onSnapshot(s=>{S.logs=s.docs.map(d=>d.data()).sort((a,b)=>(b.at?.seconds||9e9)-(a.at?.seconds||9e9));render()},er))}
 if(u.role==='faculty')S.unsub.push(db.collection('users').where('facultyUids','array-contains',u.uid).onSnapshot(us,er));
 render();if(u.mustChange===true)forceChange()}

function forgot(){open(`<h3>Forgot password</h3><p>Enter your ID. Your administrator will get a reset link, set a new password and message it to you.</p><label>Your ID</label><input id="fi" autocomplete="username"><div class="err" id="fe" role="alert"></div><div class="dact"><button class="btn alt" data-a="close">Cancel</button><button class="btn" id="fs">Request reset</button></div>`);
 $('#fs').onclick=async()=>{const v=$('#fi').value.trim().toLowerCase();if(!v)return $('#fe').textContent='Enter your ID.';try{await auth.sendPasswordResetEmail(authEmail(v));$('#fe').style.color='var(--ok)';$('#fe').textContent='Request sent. Your administrator will message you a new password.'}catch(x){$('#fe').style.color='var(--bad)';$('#fe').textContent='Could not send the request. Check your ID and try again.'}}}
function forceChange(){open(`<h3>Set your own password</h3><p>For your security, choose a new password before you continue.</p><label>New password (min 8 characters)</label><input id="p1" type="password" autocomplete="new-password"><label>Repeat password</label><input id="p2" type="password" autocomplete="new-password"><div class="err" id="pe" role="alert"></div><button class="btn" id="ps">Save password</button>`);dlg.oncancel=e=>e.preventDefault();
 $('#ps').onclick=async()=>{const a=$('#p1').value,b=$('#p2').value,m=$('#pe');if(a.length<8)return m.textContent='Use at least 8 characters.';if(a!==b)return m.textContent='The two passwords do not match.';if(/^[A-Za-z]+@\d+$/.test(a))return m.textContent='Choose something different from name@number.';try{await auth.currentUser.updatePassword(a);await db.doc('users/'+S.user.uid).update({mustChange:false});S.user.mustChange=false;dlg.oncancel=null;close()}catch(x){m.textContent='Could not save. Sign out, sign in again and retry.'}}}

/* ===== shell ===== */
const TABS={student:[['home','My courses'],['sessions','Sessions']],faculty:[['home','Review queue'],['record','Record session'],['sessions','All sessions'],['progress','Student progress']],admin:[['home','Overview'],['students','Students'],['faculty','Faculty'],['courses','Courses'],['sessions','Session register'],['ratings','Ratings'],['audit','Audit log']]};
const badge=s=>`<span class="pill" style="background:${{active:'#0F9D6E',completed:'#2F7BFF',suspended:'#D6453B'}[s]||'#5E6B82'}">${s}</span>`;
const rowFilter=()=>{const q=($('#uq')&&$('#uq').value||'').toLowerCase(),f=$('#uf')&&$('#uf').value||'';document.querySelectorAll('#ut tr[data-r]').forEach(r=>{r.style.display=(r.textContent.toLowerCase().includes(q)&&(!f||r.dataset.st===f))?'':'none'})};
function render(){const u=S.user;if(!u)return;const unread=S.notes.filter(n=>!n.read).length,keep=[$('#uq')&&$('#uq').value,$('#uf')&&$('#uf').value];
 $('#app').innerHTML=`<header class="top"><div class="brand">${LOGO}<div><b>CADTrack 360</b><small>by 10XCADD</small></div></div><span class="sp"></span><div class="who"><b>${esc(u.name)}</b><small>${esc(u.loginId)} · ${u.role}</small></div>
 <button class="btn alt sm ib" data-a="bell" aria-label="Notifications">Alerts${unread?`<i>${unread}</i>`:''}</button><button class="btn alt sm" data-a="pw">Password</button><button class="btn alt sm" data-a="out">Log out</button></header>
 <nav class="tabs">${TABS[u.role].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</nav><main>${S.err?`<div class="note bad">${esc(S.err)}</div>`:''}${VIEW[u.role][S.tab]()}</main>`;
 if($('#uq')&&keep[0]!=null){$('#uq').value=keep[0];$('#uf').value=keep[1]||'';rowFilter()}}
const sessCard=(s,acts)=>`<div class="card"><div class="row"><b style="color:var(--ink)">${esc(s.title)}</b>${pill(s.status)}</div>

function ackDialog(id,keep){const s=sess(id),d=keep||JSON.parse(localStorage.getItem('draft-'+id)||'{}');
 open(`<h3>Review and acknowledge</h3><div class="note">Please review the session details carefully before submitting your response. By acknowledging this session, you confirm that you have reviewed the recorded training topics and are providing an accurate response about your learning experience.<br><br>If a topic was not covered, was only partially covered, or requires further explanation, use the appropriate feedback option instead of confirming something inaccurate.<br><br>Your response will be recorded with a timestamp and submitted for faculty review. Your acknowledgement does not, by itself, complete or approve the session.</div>

 <label style="display:block;margin-top:10px">Your response (required)</label>${Object.entries(RESP).map(([k,v])=>`<label class="c"><input type="radio" name="p" value="${k}" ${d.resp===k?'checked':''}>${v}</label>`).join('')}

 <label>Comment (required if topics were not covered or you need clarification)</label><textarea name="c" rows="3">${esc(d.comment||'')}</textarea><div class="err" id="ae" role="alert"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn alt" data-a="draft" data-v="${id}">Save local draft</button><button type="button" class="btn alt" data-a="close">Cancel</button><button class="btn">Continue</button></div></form>`);
 $('#af').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r=+f.get('r'),p=f.get('p'),t=f.getAll('t'),c=(f.get('c')||'').trim(),m=$('#ae');
  if(!r)return m.textContent='Choose a rating from 1 to 5.';if(!p)return m.textContent='Choose how you want to respond.';
  if(p==='not_covered'&&!c)return m.textContent='Explain what was not covered.';if(p==='not_covered'&&!t.length)return m.textContent='Select the topics that were not covered.';
  if(p==='covered_revision'&&!t.length)return m.textContent='Select the topics that need revision.';if(p==='clarify'&&!c)return m.textContent='Tell faculty what you need clarified.';

function confirmAck(id,d){open(`<h3>Confirm Session Response?</h3><p>You are about to submit your response for this training session. Your response, rating, comments, and relevant acknowledgement details will be recorded with a timestamp and made available to authorized faculty for review.</p><p>After submission, you will not be able to edit or withdraw this response yourself. If a correction is required, contact the administrator.</p><p>Your response does not mean that the session or the entire course is automatically approved. Verified progress will be updated only after the required review and completion conditions have been satisfied.</p><div class="err" id="ce" role="alert">${navigator.onLine?'':'You are offline. Connect to submit.'}</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn alt" id="gb">Go Back</button><button class="btn" id="cs" ${navigator.onLine?'':'disabled'}>Confirm and Submit</button></div>`);
 $('#gb').onclick=()=>ackDialog(id,d);

 open(`<h3>Review: ${esc(s.title)}</h3><p>${esc(s.studentName)} (${esc(s.studentId)}) · ${esc(s.date)} · ${pill(s.status)}</p><p>${s.topicIds.map(t=>'• '+esc(tname(s.courseId,t))).join('<br>')}</p>
 <div class="note">${'★'.repeat(s.rating)} (${s.rating}/5) · ${esc(RESP[s.resp])} · ${fmt(s.ackAt)}<br>${esc(s.comment||'No comment')}<br>Flagged topics: ${(s.revTopics||[]).map(t=>esc(tname(s.courseId,t))).join(', ')||'none'}</div>

 <label>Topics to revise (for “Require revision”)</label>${s.topicIds.map(t=>`<label class="c"><input type="checkbox" name="rt" value="${t}" ${(s.revTopics||[]).includes(t)?'checked':''}>${esc(tname(s.courseId,t))}</label>`).join('')}<div class="err" id="re" role="alert"></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ok" data-a="dec" data-v="${id}" data-d="approved">Approve</button><button class="btn bad" data-a="dec" data-v="${id}" data-d="rejected">Reject</button><button class="btn rev" data-a="dec" data-v="${id}" data-d="clarification">Request clarification</button><button class="btn rev" data-a="dec" data-v="${id}" data-d="revision">Require revision</button><button class="btn alt" data-a="close">Close</button></div>`)}
async function decide(id,to){const s=sess(id),n=$('#rv').value.trim(),rt=[...document.querySelectorAll('[name=rt]:checked')].map(x=>x.value),m=$('#re');

 const b=db.batch(),u={status:to,reviewNote:n,reviewedAt:TS(),reviewedBy:S.user.uid};if(to==='revision')u.facRevTopics=rt;

  if(!cs.length)return m.textContent='Tick at least one software.';
  let enrol={},fu=[];if(R){for(const c of cs){const s=document.querySelector('[data-f="'+c+'"]'),f=s&&s.value;if(!f)return m.textContent='Select a faculty for '+course(c).name+'.';enrol[c]={uid:f,name:fac.find(x=>x.uid===f).name};fu.push(f)}fu=[...new Set(fu)]}
  $('#pgo').disabled=true;
  try{if(t){const u={name,phone,courses:cs};if(R){u.enrol=enrol;u.facultyUids=fu;u.admDate=$('#pd').value}await db.doc('users/'+t.uid).update(u);close()}
   else await createUser(role,name,phone,cs,enrol,fu,R?$('#pd').value:'')}catch(x){m.textContent='Could not save: '+x.message;$('#pgo').disabled=false}}}
async function createUser(role,name,phone,cs,enrol,fu,adm){const first=name.split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,'');if(!first)throw new Error('The name must contain letters a to z.');
 let id,n=0;do{id=first+'_'+(100+Math.floor(Math.random()*900));n++}while(S.users.some(u=>u.loginId===id)&&n<60);
 const pw=first[0].toUpperCase()+first.slice(1)+'@'+id.split('_')[1],sec=firebase.apps.find(x=>x.name==='sec')||firebase.initializeApp(CFG,'sec'),c=await sec.auth().createUserWithEmailAndPassword(authEmail(id),pw);
 const doc={loginId:id,name,phone,role,status:'active',courses:cs,mustChange:true,createdAt:TS(),createdBy:S.user.uid};if(role==='student'){doc.enrol=enrol;doc.facultyUids=fu;doc.admDate=adm}
 await db.doc('users/'+c.user.uid).set(doc);await sec.auth().signOut();
 S.msg=credMsg(role,name,id,pw,false,'Software: '+cs.map(x=>course(x).name+(role==='student'?' (faculty: '+enrol[x].name+')':'')).join(', '));S.ph=phone;
 open(`<h3>Account created</h3><textarea readonly rows="10">${esc(S.msg)}</textarea><div class="dact"><button class="btn ok" data-a="wa">Send on WhatsApp</button><button class="btn alt" data-a="cp">Copy message</button><button class="btn alt" data-a="close">Done</button></div><p class="note" style="margin-top:12px">The password is not stored anywhere. Send or copy it now. The user must set their own password at first login.</p>`)}
function completeDlg(uid){const t=S.users.find(x=>x.uid===uid),ss=S.sessions.filter(s=>s.studentUid===uid);
 open(`<h3>Course completion: ${esc(t.name)}</h3><p class="sub">Verified progress comes from faculty-approved sessions. Completing below 100% needs a written reason and is recorded in the audit log.</p>${(t.courses||[]).map(c=>{const co=course(c),p=prog(co,ss),d=(t.completed||{})[c];return `<div class="card"><div class="row"><b style="color:var(--ink)">${esc(co.name)}</b><span>Verified ${p.ver}%</span></div>${d?`<div class="note" style="margin:8px 0">Completed ${fmt(d.at)} by ${esc(d.by)}. ${esc(d.reason||'')}</div><button class="btn alt sm" data-a="cgo" data-v="${uid}" data-c="${c}" data-m="reopen">Reopen course</button>`:`<button class="btn ok sm" style="margin-top:8px" data-a="cgo" data-v="${uid}" data-c="${c}" data-m="done" data-p="${p.ver}">Mark complete</button>`}</div>`}).join('')||'<div class="empty">No courses.</div>'}<button class="btn alt" data-a="close">Close</button>`)}
function completeGo(uid,cid,mode,ver){const t=S.users.find(x=>x.uid===uid),co=course(cid),done=mode==='done';
 reason(esc((done?'Mark complete: ':'Reopen: ')+co.name+' for '+t.name+(done?' (verified '+ver+'%)':'')),async r=>{const b=db.batch();
  b.update(db.doc('users/'+uid),{['completed.'+cid]:done?{at:TS(),by:S.user.loginId,reason:r,verified:ver}:firebase.firestore.FieldValue.delete()});
  b.set(db.collection('adminLogs').doc(),{type:done?'course_complete':'course_reopen',targetUid:uid,targetName:t.name,courseId:cid,reason:r,verified:ver,actorUid:S.user.uid,actorId:S.user.loginId,at:TS()});await b.commit()})}
function delUser(uid){const t=S.users.find(x=>x.uid===uid);
 if(t.role==='faculty'){const n=S.users.filter(s=>s.role==='student'&&(s.facultyUids||[]).includes(uid)).length;if(n)return alert(n+' student(s) are assigned to '+t.name+'. Reassign them (Students > Edit) before deleting this faculty.')}
 reason(esc('Delete '+t.name+' ('+t.loginId+')? The profile is removed and they can no longer sign in. Session records stay for the audit trail.'),async r=>{const b=db.batch();b.delete(db.doc('users/'+uid));
  b.set(db.collection('adminLogs').doc(),{type:'user_delete',targetUid:uid,targetName:t.name,targetId:t.loginId,role:t.role,reason:r,actorUid:S.user.uid,actorId:S.user.loginId,at:TS()});await b.commit()})}
function newCourse(){open(`<h3>Create course / syllabus version</h3><form id="cf"><label>Course ID (letters, no spaces, e.g. acad)</label><input id="ci" required pattern="[a-z0-9-]+"><label>Course name</label><input id="cn" required><label>Category</label><input id="cg" list="cats" required><datalist id="cats"><option>General CAD / AutoCAD<option>Civil<option>Mechanical<option>Interior Design</datalist>
 <label>Syllabus: one topic per line as <code>Module | Topic</code> (add <code>| optional</code> for optional topics). Paste your real syllabus.</label><textarea id="ct" rows="7" required></textarea><div class="err" id="ce2"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn alt" data-a="close">Cancel</button><button class="btn">Validate and save</button></div></form>`);
 $('#cf').onsubmit=async e=>{e.preventDefault();const ids=new Set(),topics=[],bad=[];$('#ct').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach((l,i)=>{const p=l.split('|').map(x=>x.trim());if(p.length<2||!p[0]||!p[1])return bad.push('Line '+(i+1)+': needs Module | Topic');const id='T'+String(topics.length+1).padStart(3,'0');ids.add(id);topics.push({id,module:p[0],name:p[1],mandatory:p[2]!=='optional'})});
  if(bad.length)return $('#ce2').textContent=bad.slice(0,3).join(' ; ');const ref=db.doc('courses/'+$('#ci').value),ex=await ref.get();if(ex.exists)return $('#ce2').textContent='That course ID exists. Use a new ID for a new syllabus version.';
  await ref.set({name:$('#cn').value.trim(),category:$('#cg').value.trim(),topics,version:1,createdAt:TS(),createdBy:S.user.uid});close()}}

/* ===== events ===== */
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v,u=S.user;
 if(a==='tab'){S.tab=v;render()}else if(a==='out')auth.signOut();else if(a==='close')close();
 else if(a==='ack')ackDialog(v);else if(a==='rev')reviewDialog(v);else if(a==='dec')decide(v,el.dataset.d);else if(a==='hist')history(v);
 else if(a==='draft'){const f=new FormData($('#af'));localStorage.setItem('draft-'+v,JSON.stringify({rating:+f.get('r')||0,resp:f.get('p'),revTopics:f.getAll('t'),comment:f.get('c')}));$('#ae').textContent='Draft saved on this device. It is NOT submitted.'}
 else if(a==='flt'){}else if(a==='adds')personForm('student');else if(a==='addf')personForm('faculty');else if(a==='edt'){const x=S.users.find(z=>z.uid===v);personForm(x.role,x)}else if(a==='cmp')completeDlg(v);else if(a==='cgo')completeGo(v,el.dataset.c,el.dataset.m,+el.dataset.p||0);else if(a==='del')delUser(v);else if(a==='newc')newCourse();
 else if(a==='tog'){const t=S.users.find(x=>x.uid===v);await db.doc('users/'+v).update({status:t.status==='active'?'suspended':'active'})}
 else if(a==='asg'){const t=S.users.find(x=>x.uid===v),r=prompt('Course IDs, comma separated ('+S.courses.map(c=>c.id).join(', ')+')',(t.courses||[]).join(','));if(r!==null)await db.doc('users/'+v).update({courses:r.split(',').map(x=>x.trim()).filter(x=>S.courses.some(c=>c.id===x))})}
 else if(a==='reopen')reason('Reopen session',async r=>{const s=sess(v),b=db.batch();b.update(db.doc('sessions/'+v),{status:'taught',reopenReason:r,reopenedAt:TS(),reopenedBy:u.uid});ev(b,s,'admin_reopen',s.status,'taught',r);nt(b,s.studentUid,`"${s.title}" was reopened by admin`,v);await b.commit()});
 else if(a==='wa'){const p=S.ph?(S.ph.length===10?'91'+S.ph:S.ph):'';window.open('https://wa.me/'+p+'?text='+encodeURIComponent(S.msg),'_blank')}else if(a==='cp'){try{await navigator.clipboard.writeText(S.msg);el.textContent='Copied ✓'}catch(x){prompt('Copy this message:',S.msg)}}else if(a==='seed'){const ex=new Set(S.courses.map(c=>c.id)),todo=SEED.filter(c=>!ex.has(c.id));if(!todo.length)return alert('All institute courses are already loaded.');if(!confirm('Add '+todo.length+' courses with their syllabus?'))return;const b=db.batch();todo.forEach(c=>b.set(db.doc('courses/'+c.id),{name:c.name,category:c.category,topics:c.topics,version:1,createdAt:TS(),createdBy:S.user.uid}));try{await b.commit();alert('Loaded '+todo.length+' courses.')}catch(x){alert('Not saved: '+x.message)}}else if(a==='rst'){const t=S.users.find(x=>x.uid===v);try{await auth.sendPasswordResetEmail(authEmail(t.loginId))}catch(x){return alert('Could not send the reset email: '+x.message)}
  open(`<h3>Reset password for ${esc(t.name)}</h3><ol><li>Open the 10xcadd@gmail.com inbox (check Spam) and find "Reset your password".</li><li>Click the link and set a new password for <b>${esc(t.loginId)}</b>.</li><li>Type that password below to send it to ${esc(t.name)}.</li></ol><label>New password you set</label><input id="np"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok" data-a="rwa" data-v="${v}">Send on WhatsApp</button><button class="btn alt" data-a="close">Close</button></div>`)}
 else if(a==='rwa'){const t=S.users.find(x=>x.uid===v),p=$('#np').value.trim();if(p.length<6)return alert('Type the new password you set.');S.msg=credMsg(t.role,t.name,t.loginId,p,true);const ph=t.phone||'';try{await db.doc('users/'+v).update({mustChange:true})}catch(x){}
  window.open('https://wa.me/'+(ph?(ph.length===10?'91'+ph:ph):'')+'?text='+encodeURIComponent(S.msg),'_blank')}
 else if(a==='msg'){const t=S.users.find(x=>x.uid===v);S.msg=credMsg(t.role,t.name,t.loginId,'');S.ph=t.phone||'';open(`<h3>Message ${esc(t.name)}</h3><textarea readonly rows="8">${esc(S.msg)}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok" data-a="wa">Send on WhatsApp</button><button class="btn alt" data-a="cp">Copy message</button><button class="btn alt" data-a="close">Done</button></div>`)}
 else if(a==='bell'){open(`<h3>Notifications</h3>${S.notes.map(n=>`<div class="card" style="${n.read?'opacity:.6':''}">${esc(n.text)}<br><small>${fmt(n.at)}</small></div>`).join('')||'<div class="empty">No notifications.</div>'}<button class="btn alt" data-a="close">Close</button>`);S.notes.filter(n=>!n.read).forEach(n=>db.doc('notifications/'+n.id).update({read:true}))}
 else if(a==='pw'){const p=prompt('New password (min 8 characters)');if(p&&p.length>=8)auth.currentUser.updatePassword(p).then(()=>alert('Password changed.')).catch(()=>alert('For security, sign out, sign in again, then retry.'))}
 else if(a==='csv'){const rows=[['Report: session register'],['Generated',new Date().toISOString()],['Filter status',S.f3||'all'],[],['Session','Course','Student ID','Student','Faculty','Training date','Status','Rating','Response','Created','Student responded','Reviewed']].concat(fl('f3',S.sessions).map(s=>[s.title,course(s.courseId).name,s.studentId,s.studentName,s.facultyName,s.date,s.status,s.rating||'',s.resp||'',fmt(s.createdAt),fmt(s.ackAt),fmt(s.reviewedAt)]));
  const a2=document.createElement('a');a2.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a2.download='cadtrack-sessions.csv';a2.click()}});
document.addEventListener('input',e=>{if(e.target.id==='uq')rowFilter()});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.a==='flt'){S[el.dataset.k]=el.value;render()}
 if(el.id==='rc')topicsFor();if(el.id==='uf')rowFilter();});
function topicsFor(){const c=course($('#rc').value),stu=S.users.filter(u=>u.role==='student'&&u.enrol&&u.enrol[c.id]&&u.enrol[c.id].uid===S.user.uid&&!(u.completed||{})[c.id]);
 $('#rx').innerHTML=`<label>Topics actually taught</label>${(c.topics||[]).map(t=>`<label class="c"><input type="checkbox" name="rtp" value="${t.id}">${esc(t.name)}</label>`).join('')}<label>Students (each responds separately)</label>${stu.map(x=>`<label class="c"><input type="checkbox" name="rst" value="${x.uid}">${esc(x.name)} (${esc(x.loginId)})</label>`).join('')||'<small>No students assigned to this course.</small>'}`}
new MutationObserver(()=>{if($('#rx')&&!$('#rx').innerHTML)topicsFor()}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('submit',async e=>{if(e.target.id!=='rf')return;e.preventDefault();const tp=[...document.querySelectorAll('[name=rtp]:checked')].map(x=>x.value),st=[...document.querySelectorAll('[name=rst]:checked')].map(x=>S.users.find(u=>u.uid===x.value));
 if(!tp.length||!st.length)return alert('Select at least one topic and one student.');
 const cid=$('#rc').value,dup=S.sessions.filter(s=>s.courseId===cid&&s.date===$('#rd').value&&st.some(x=>x.uid===s.studentUid)&&s.topicIds.some(t=>tp.includes(t)));
 if(dup.length&&!confirm('Possible duplicate: a session on these topics already exists for this date and student. Record anyway?'))return;
 const b=db.batch();for(const x of st){const r=db.collection('sessions').doc(),s={id:r.id,studentUid:x.uid,facultyUid:S.user.uid};
  b.set(r,{courseId:cid,topicIds:tp,studentUid:x.uid,studentId:x.loginId,studentName:x.name,facultyUid:S.user.uid,facultyName:S.user.name,date:$('#rd').value,title:$('#rt').value.trim(),notes:$('#rn').value.trim(),status:'taught',createdAt:TS()});ev(b,s,'session_recorded',null,'taught',null);nt(b,x.uid,`New session to review: ${$('#rt').value.trim()}`,r.id)}
 try{await b.commit();S.tab='sessions';render()}catch(x){alert('Not saved: '+x.message)}});
addEventListener('online',()=>$('#net').style.display='none');addEventListener('offline',()=>$('#net').style.display='block');if(!navigator.onLine)$('#net').style.display='block';

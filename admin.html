<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CADTrack 360 · Admin</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg"><meta name="theme-color" content="#0B1F44">
<style>
:root{--navy:#0B1F44;--blue:#2F7BFF;--gold:#F5B301;--bg:#F3F5F9;--line:#DDE2EC;--ink:#14213D;--mute:#5B6678;--ok:#12805C;--warn:#B7791F;--bad:#C0362C;--rev:#6D4AC2}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:5}
header b{font-size:17px}header small{color:#9FB2D9;display:block;font-size:12px}header .sp{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 12px}
nav button{border:0;background:none;padding:12px 14px;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
nav button.on{color:var(--navy);border-color:var(--gold);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
h2{margin:4px 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:10px 14px;min-height:44px}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.rev{background:var(--rev)}.btn.sm{min-height:36px;padding:6px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;margin:4px 0 10px}
label{font-size:13px;color:var(--mute)}label.c{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;margin:6px 0}label.c input{width:auto;margin:3px 0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.bar{height:8px;background:#E6EAF2;border-radius:4px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw{overflow-x:auto}
dialog{border:0;border-radius:10px;padding:18px;width:min(560px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#0B1F4499}
.stars{display:flex;gap:6px;flex-wrap:wrap}.stars label{border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:44px;color:var(--ink);cursor:pointer}
.stars input{position:absolute;opacity:0}.stars label:has(input:checked){background:var(--gold);border-color:var(--gold);font-weight:700}.stars label:has(input:focus-visible){outline:2px solid var(--blue)}
#login{max-width:380px;margin:8vh auto;padding:0 16px}.err{color:var(--bad);font-size:14px;min-height:20px}
#net{background:var(--bad);color:#fff;text-align:center;font-size:13px;padding:4px;display:none}
.empty{color:var(--mute);text-align:center;padding:24px}.note{background:#FFF7DF;border:1px solid #F1DC96;border-radius:6px;padding:10px;font-size:13px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style></head><body>
<div id="net">Offline — official submissions need a connection. Drafts stay on this device only.</div>

<script>
const ROLE='admin';const SEED=[{"id":"autocad2d_civil","name":"AutoCAD 2D Civil","category":"Civil","topics":[{"id":"T001","module":"AutoCAD 2D Civil","name":"S1 · Introduction & Projections","detail":"Introduction: About CADD centre, AutoCAD History, Engineering Drawings. Projections (First & Third angle), Views (Orthographic, Isometric & Perspective). Exploring GUI, Workspaces. Co-ordinate systems.","mandatory":true},{"id":"T002","module":"AutoCAD 2D Civil","name":"S2 · Drawing Settings & Display Control","detail":"Drawing settings: Units, Limits, Options, Application status Bar. Display Control: Zoom, Pan, Regen, Clean Screen & Drafting setting.","mandatory":true},{"id":"T003","module":"AutoCAD 2D Civil","name":"S3 · Object Properties & File Management","detail":"Object Properties: Color, Linetype, Ltscale, Lineweight. File Management: New, Qnew, Open, Save, Save as, Close, Exit, Quit.","mandatory":true},{"id":"T004","module":"AutoCAD 2D Civil","name":"S4 · Drawing & Modify Tools","detail":"Drawing Tools: Line, Xline, Polyline, Circle, Rectangle, Arc, Ellipse, Polygon, Donut. Modify Tools: Trim, Extend, Erase, Undo, Redo, Join, Explode, Offset, Move, Copy, Rotate, Mirror, Scale, Stretch, Lengthen, Break, Array, Align, Fillet, Chamfer.","mandatory":true},{"id":"T005","module":"AutoCAD 2D Civil","name":"S5 · Dimensioning","detail":"Dimension Setting: Dimension Style. Dimension: Linear, Aligned, Radius, Diameter, Center Mark, Angle, Arc length, Jogged radius, Ordinate dimensions, Continuous & Baseline dimension, Dimension Space, Dimension Break, Inspection, Tolerance.","mandatory":true},{"id":"T006","module":"AutoCAD 2D Civil","name":"S6 · Leader & Dimension Editing","detail":"Leader: Leader, Qleader, Mleader, Multi leader style, Add leader, Align Leader lines, Collect Leader. Dimension Editing: Dim edit, dimtedit, Dimension Associative, Reassociate.","mandatory":true},{"id":"T007","module":"AutoCAD 2D Civil","name":"S7 · Measurements & Annotation","detail":"Measurements: Divide, Measure. Annotation Tools: Text Style, Mtext, Scaletext, Spell.","mandatory":true},{"id":"T008","module":"AutoCAD 2D Civil","name":"S8 · Advanced Drawing & Modify Tools","detail":"Drawing Tools: Multiline, Pline, Spline, Ray, Wipeout, Revision cloud. Modify Tools: MLstyle, MLedit, Pedit, Splinedit, Grip Editing.","mandatory":true},{"id":"T009","module":"AutoCAD 2D Civil","name":"S9 · Civil Drawing & Project","detail":"Civil Drawing: Isometric View Drawing, Perspective View Drawing (one point & Two point). Project: Perspective View - Building Exterior (Two point perspective) & Interior (One point perspective).","mandatory":true},{"id":"T010","module":"AutoCAD 2D Civil","name":"S10 · Hatching & Inquiry Commands","detail":"Hatching utilities: Hatch, Hatchedit, Gradient. Inquiry commands: Id, Dist, List, Radius, Angle, Area, Volume, Fill, Fill mode.","mandatory":true},{"id":"T011","module":"AutoCAD 2D Civil","name":"S11 · Layer Management","detail":"Layer Management: Adding / Removing Layers, New Property Filter, New Group Filter, Layer States Manager.","mandatory":true},{"id":"T012","module":"AutoCAD 2D Civil","name":"S12 · Selection Methods & Tables","detail":"Selection Methods: Object Selection Methods, Qselect, Filter. Table: Table, Tablestyle, Tabledit.","mandatory":true},{"id":"T013","module":"AutoCAD 2D Civil","name":"S13 · Symbol & BOM Creation - Blocks","detail":"Symbol & BOM Creation: Block, Wblock, Insert. Attribute: Attdef, Attedit, Eattedit, Attdisp, Attdia.","mandatory":true},{"id":"T014","module":"AutoCAD 2D Civil","name":"S14 · Dynamic Blocks & Parametric Modeling","detail":"Symbol & BOM Creation: Dynamic Block. Parametric Modeling: Geometric Constraint, Dimensional Constraint, Design Centre, Tool Palette.","mandatory":true},{"id":"T015","module":"AutoCAD 2D Civil","name":"S15 · OLE, Copy-Paste & External References","detail":"OLE concepts: Insert object, Olelinks, Olescale. Copy & Paste Concepts: Copy, Copybase, Copylink, Pasteclip, Pastespecial, Pasteblock, Paste original. External references: Xref, Xbind, Refedit.","mandatory":true},{"id":"T016","module":"AutoCAD 2D Civil","name":"S16 · File Setup & Plot Control","detail":"File Setup: Hyperlink, Etransmit, Publish. Plot control: Introduction to plotting, Page setup, Plot Styles, Layout, Mview, Mspace, Pspace.","mandatory":true}]},{"id":"3dsmax","name":"3ds Max","category":"Visualisation","topics":[{"id":"T001","module":"3ds Max","name":"S1 · Introduction & Interface - Sofa Models","detail":"Creating a 3 Seater and single seater Sofa with different visual styles: Need for 3D, Introduction about 3ds Max Project work flow - Modeling, Texturing, Lighting, Animation, Rendering and Compositing. Definition for Max for Engineers/Architects. User interface - Command Panel, Main Toolbar, Customizing Viewport, View port controls. Different Visual styles (Quadro graphics card and recommended). Explain about different Output file formats - JPEG, GIFF, TIFF, AVI, BMP, TGA. Creating, Modifying & Transforming Standard primitives-All, Extended primitives-All. Creating objects using Key board entry, Naming the object.","mandatory":true},{"id":"T002","module":"3ds Max","name":"S2 · Selection, Transform & Clone - Waiting Hall","detail":"Creating a waiting hall by using clone option and co-ordinate systems: Selection methods: Selection Region with Window/Crossing, Select by Name window, Named and Edit selection set, Select by object window. Transforming Objects: Move, Rotate, Uniform & Non-uniform Scaling, Using Axis constraints(X,Y,Z), Transform type in Window. Reference Co-ordinate System (View, Local, Pick). Pivot Point: Use Pivot point center, Use Selection center, Use Transform Coordinate center. Clone Method: Copy option.","mandatory":true},{"id":"T003","module":"3ds Max","name":"S3 · Unit Setup, Grouping & Alignment - Auditorium","detail":"Creating an auditorium model: Unit Setup: System Unit Setup, Display Unit Scale. Group – Ungroup, Open, Close, Attach, Detach. Hierarchy (Affect Pivot Only, Affect Object only, Affect Hierarchy only, Center to Object, Align to Object, Align to World). Snap: 2D, 2.5D, 3D, Angular snap, Percent Snap. Utility tools: Align tool, Quick Align, Mirror, Array, Spacing tool, Clone and Align, Layer Manager.","mandatory":true},{"id":"T004","module":"3ds Max","name":"S4 · Parametric Deformers - Chair Model","detail":"Creating a Chair model: Modeling using Parametric Deformers (Modifiers): Bend, Taper, Twist, Relax, Skew, Stretch, Mirror. Selection Modifiers: Mesh select, Poly select, Patch select.","mandatory":true},{"id":"T005","module":"3ds Max","name":"S5 · Free Form Deformers - Pillow Model","detail":"Creating a Pillow model: Modeling using Free Form Deformers (Modifiers): FFD Box, FFD Cylinder, FFD2x2x2, FFD3x3x3, FFD4x4x4.","mandatory":true},{"id":"T006","module":"3ds Max","name":"S6 · Poly Modeling - King Size Sofa","detail":"Creating a King size sofa model: Poly Modeling Tools: Convert to editable poly, Edit Poly-Selection, Soft selection, Edit polygons, Edit geometry, Polygon properties, Paint deformation. Poly Modeling: Creating a Set model.","mandatory":true},{"id":"T007","module":"3ds Max","name":"S7 · Splines & Patch Modeling - Logo & Cushion Sofa","detail":"Creating a Logo model. Creating a Cushion sofa model. Shapes: Splines, Extended Splines. Edit Spline Modifier. Patch Modeling: Edit patch - Selection, Geometry, Surface properties. Patch Modeling using Shapes with 2D Snap, Edit spline modifier, Rendering, Interpolation, Selection, Soft selection, Geometry.","mandatory":true},{"id":"T008","module":"3ds Max","name":"S8 · AEC Objects & Compound Objects - Building with Trees","detail":"Creating a building model with trees and plants. Modeling the building using AEC Extended objects: Wall, Railing, Foliage, Stairs, Doors and Windows. Compound Objects: Boolean, Pro-Boolean (Scatter, Connect).","mandatory":true},{"id":"T009","module":"3ds Max","name":"S9 · 2D Modifiers & Path/Patch Deform - Fountain Source","detail":"Creating Fountain source model. 2D Modifiers: Extrude, Lathe (Bevel Profile, Bevel, Cap holes, Sweep). Animation Modifiers (Path deform (WSM), Patch deform (WSM)).","mandatory":true},{"id":"T010","module":"3ds Max","name":"S10 · Compound Objects & File Import - Cycle Model","detail":"Creating a Cycle model. Compound Object - Shape Merge, Loft, Deforming Loft objects: Scale, Twist & Teeter, Bevel. Importing ArchiCAD files, 3d AutoCAD files, Xref.","mandatory":true},{"id":"T011","module":"3ds Max","name":"S11 · Material Editor - Architectural Material","detail":"Creating an architectural material for the building model. Slate Material Editor and Compact Material Editor: Tools in material editors, Extended parameters, Saving Materials.","mandatory":true},{"id":"T012","module":"3ds Max","name":"S12 · Material Types & Maps","detail":"Creating a different types of materials to building model. Materials: Standard, Architectural, Multi/sub objects materials. Standard Material - Maps Rollout: Diffuse, Opacity, Raytrace, Bump, Reflection, Refraction.","mandatory":true},{"id":"T013","module":"3ds Max","name":"S13 · Compound Materials - Wall & Partition","detail":"Applying special material to Wall and partition wall objects. Compound Materials: Blend, Double sided, Top/Bottom, Shellac materials.","mandatory":true},{"id":"T014","module":"3ds Max","name":"S14 · Lighting - Interior & Exterior","detail":"Applying the light object to the building model interior and exterior. Standard Lights: Omni - General Parameters, Intensity/color/Attenuation, Advance effects, Shadow parameters, Shadow Map Parameters, Target & Free spot, Target & Free Direct, Sky light. Photometric lights: Target Light, Free Light, Exposure Controls, Templates, General Parameters, Shadows, Light Distribution, Intensity/Color/Attenuation, Light Shape.","mandatory":true},{"id":"T015","module":"3ds Max","name":"S15 · Particle Systems & Space Warps - Water Fountain","detail":"Creating Water Fountain. Particle systems: Spray, Snow, Super spray. Space warps: Forces, Path Follow, Wind, Motor, Gravity. Deflectors: Deflector, UDeflector, Sdeflector.","mandatory":true},{"id":"T016","module":"3ds Max","name":"S16 · Environment Effects - Fog, Water & Cloth","detail":"Creating Fog environment for the building model. Environment effects: Atmospheric effects, Bogizmo, Sphere Gizmo, CylGizmo, Fire – Fire Ball, Explosion, Tendril. Environment Effect: Volume Fog and Fog. Water Effect: Flex modifier, Attachment Constraint. Cloth Effect: Cloth Modifier.","mandatory":true},{"id":"T017","module":"3ds Max","name":"S17 · Cameras & Animation - Walkthrough","detail":"Creating a Perspective view and animation walkthrough using camera. Cameras: Target Camera & Free Camera. Animation: Introduction to Key frame Animation, Path Animation – Path Constraint. Graph Editors: Track view Dope Sheet, Track view Curve Editor.","mandatory":true},{"id":"T018","module":"3ds Max","name":"S18 · Advanced Rendering","detail":"Applying advanced rendering to get realistic effect for the building. Rendering: Scanline Rendering. Advanced Rendering: Quick Silver Hardware Rendering, Mentalray Rendering, Exposure Control, Advanced Lighting Dialog – Radiosity, Light Tracer, Advanced Lighting Override, Render to Texture, Iray rendering.","mandatory":true},{"id":"T019","module":"3ds Max","name":"S19 · File Handling, Video Post & Export Formats","detail":"Handling other max files and applying external filter effects. File Handling: Merging max files, Render AVI files file formats, Print Size Wizard - TIFF. Video post Filter Events: Lens Effects Glow, Lens Effects Highlight, Lens Effects Flare. Composite Multiple AVI files into a single Avi file. Export File formats - Obj, Iges, 3ds.","mandatory":true},{"id":"T020","module":"3ds Max","name":"S20 · Mini Project","detail":"Creating a mini project.","mandatory":true}]},{"id":"vray_max","name":"V-Ray for 3ds Max","category":"Visualisation","topics":[{"id":"T001","module":"V-Ray for 3ds Max","name":"S1 · Introduction & Rendering Engines","detail":"Ep.1 Introduction: Introduction to Vray, Highlights of Vray and understanding the Graphical user Interface, understanding the Vray Frame Buffer. Ep.2 Vray Rendering Engines: Understanding the Rendering, Understanding the Production Rendering mode and Real-Time Rendering Mode.","mandatory":true},{"id":"T002","module":"V-Ray for 3ds Max","name":"S2 · Image Sampling & Rendering Settings","detail":"Ep.3 Vray Image Sampling: Understanding the concept of Image sampling, Understanding the antialiasing quality and shading quality. Ep.4 Rendering Settings: Controlling the quality of Interior and Exterior renderings using Render Settings.","mandatory":true},{"id":"T003","module":"V-Ray for 3ds Max","name":"S3 · V-Ray Lights & Ambient Occlusion","detail":"Ep.5 V-Ray Lights: Introduction to Lighting concept, Understanding the Vray Area lights and its various types and options for interior renderings. Ep.6 Light Details with Ambient Occlusions: Vray Lights and 3ds Max Lights, Understanding the Vray Ambient Lights, Vray Dome Light and its various settings, Creation of Vray IES Light and its various settings, Understanding the Sun and Sky Light and its various settings for exterior renderings.","mandatory":true},{"id":"T004","module":"V-Ray for 3ds Max","name":"S4 · GI Renderings - Exterior & Interior","detail":"Ep.7 GI Renderings: Introduction to GI Concept, Understanding the various rendering engines for primary and secondary engines. Ep.8 GI for Exterior and Interior Scenes: Understanding the GI settings for Exterior Scenes using various rendering engines, Understanding the GI settings for Interior scenes using various rendering engines.","mandatory":true},{"id":"T005","module":"V-Ray for 3ds Max","name":"S5 · GI for Animation & Caustic Effects","detail":"Ep.8 GI for Quick Animation renderings: Concept of Caustics effects, Understanding the GI for Quick Animation renderings and its various options. Ep.9 Caustic Effects: Concept of Caustics effects, Understanding the Settings and options in Lights and render setup for Caustics effect and creation of caustics effects.","mandatory":true},{"id":"T006","module":"V-Ray for 3ds Max","name":"S6 · Vray Materials, Refraction & Bump Mapping","detail":"Ep.10 Vray Materials: Introduction to Vray Materials, Creation of Vray Materials, understanding the Diffuse and Roughness parameters in Vray Materials, Understanding the Reflection property of a material and its various settings & creation of reflective materials. Ep.11 Refraction, Translucent & Bump Mapping: understanding the refraction property of a material and creation of refractive materials and various settings, Understanding the Translucent Property and creating Translucent materials using its various options, Understanding the Bump and normal mapping, Creation of Textured Metals and Brushed Metals using Maps.","mandatory":true},{"id":"T007","module":"V-Ray for 3ds Max","name":"S7 · Vray Environment & Perspective Fog","detail":"Ep.12 Vray Environment: Understanding the Vray Environment Fog Effect and its various settings, Creation of Vray Environment Fog Perspective effect.","mandatory":true}]},{"id":"revit_a","name":"Revit - A","category":"BIM","topics":[{"id":"T001","module":"Revit - A","name":"S1 · Introduction to Revit Architecture & BIM","detail":"Introduction, About BIM, Introduction to Autodesk Revit Architecture, Revit File Types, Exploring User Interface, Building Elements, Starting a New Project.","mandatory":true},{"id":"T002","module":"Revit - A","name":"S2 · Drawing Plan, Levels, Grids & Walls","detail":"Drawing Plan as per Dimension, Drawing Aids, Project Units. Levels: Adding Levels, Modifying Levels, Creating Level Head, Constrain Levels. Grids. Walls: Create New Wall type, Location Line, Wall joins, Compound Wall. Practice: Let them prepare basic plan using above tools.","mandatory":true},{"id":"T003","module":"Revit - A","name":"S3 · Advanced Wall Modeling","detail":"More in Depth – Wall, Modify walls, Wall layer wrapping, Stacked wall, Vertically compound Wall, Wall shapes and Openings, Wall sweeps and Reveals, Construction Modeling Tools, Parts, Assemblies. Practice: Hands on.","mandatory":true},{"id":"T004","module":"Revit - A","name":"S4 · Modify Tools & Openings I","detail":"Modify Tools, Move, Copy, Create Similar, Rotate, Mirror, Array, Scale, Split Element, Trim, Align, Offset, Pin, Unpin, Doors, Windows, Keyboard Shortcuts. Practice: Hands on.","mandatory":true},{"id":"T005","module":"Revit - A","name":"S5 · Modify Tools & Openings II","detail":"Modify Tools, Move, Copy, Create Similar, Rotate, Mirror, Array, Scale, Split Element, Trim, Align, Offset, Pin, Unpin, Doors, Windows, Keyboard Shortcuts. Practice: Hands on.","mandatory":true},{"id":"T006","module":"Revit - A","name":"S6 · 3D Modeling - Floors & Ceilings","detail":"3D Modeling: Floor, Adding Floor, Sloped Floor, Floor Slab Edge, Ceiling, Create Ceiling, Components, Working with Modern Medium Library. Practice: Hands on.","mandatory":true},{"id":"T007","module":"Revit - A","name":"S7 · 3D Modeling - Roof & Openings","detail":"3D Modeling: Roof, Creating Roof, Modifying Roof, Shape editing for Roofs and Floors, Roof Soffit, Roof Fascia, Roof Gutter, Openings, Opening on face and Vertical Opening, Shaft opening, Dormer Opening. Practice: Hands on.","mandatory":true},{"id":"T008","module":"Revit - A","name":"S8 · Documentation - Dimensions & Constraints","detail":"Documentation: Dimensions, Temporary Dimensions, Permanent Dimensions, Modifying Dimensions, Constraints. Practice: Hands on.","mandatory":true},{"id":"T009","module":"Revit - A","name":"S9 · Managing Views","detail":"Managing Views: Creating views, Plan views, View range, Plan region, Elevation, Section, 3D Views, Lock 3D view, Background, Cropping View, Visibility or Graphics, View Templates, Duplicate Views, Visual Styles, Filter, Graphic Display Options. Practice: Hands on.","mandatory":true},{"id":"T010","module":"Revit - A","name":"S10 · Curtain Wall","detail":"Curtain Wall, Adding Curtain Grids, Mullions, Reshaping Curtain Wall Panels, Adding Curtain Door to panel, Embedded Walls.","mandatory":true},{"id":"T011","module":"Revit - A","name":"S11 · Stair & Railing","detail":"Stair by component, Creating stair by sketching, Customizing stair documentation, Stair calculator, Modify railing, Ramp, Railings, Add railings, Add railings by sketching, Modify railing continuous rail. Practice: Hands on.","mandatory":true},{"id":"T012","module":"Revit - A","name":"S12 · Conceptual Massing & Energy Analysis I","detail":"Conceptual Modeling: Massing, In place Mass, Forms, Modify Forms, Rationalizing Surface, Splitting Faces, Paint Tool, Placing Mass Instances from Mass Family, Face based Modeling, Conceptual Energy Analysis, Choosing location, Energy settings, Enable energy model, Run energy simulation, Results and compare. Practice: Hands on.","mandatory":true},{"id":"T013","module":"Revit - A","name":"S13 · Conceptual Massing & Energy Analysis II","detail":"Customizing form rationalization, Display styles for analysis add in application, Controlling visibility of mass instances. Practice: Hands on.","mandatory":true},{"id":"T014","module":"Revit - A","name":"S14 · Documentation - Text, Tags & Keynotes","detail":"Documentation: Text, Adding text notes, Modify text notes, Model text, Tag, Tag tools, Applying tag by category, Tag all not tagged, Material Tag, Keynote, Types of Keynote, Placing Keynote, Keynoting Settings, Custom Keynotes, Adding Keynote in 3D view. Practice: Hands on.","mandatory":true},{"id":"T015","module":"Revit - A","name":"S15 · Callout & Drafting Views","detail":"Callout Views, Types of Callouts, Detailing, Drafting Views: Creating drafting views, Importing views from CAD program, Reusing drafting view, Inserting detail component, Repeating detail. Practice: Hands on.","mandatory":true},{"id":"T016","module":"Revit - A","name":"S16 · Schedules","detail":"Schedules: Creating Schedules/quantities, Schedule properties, Custom parameters, Modify schedules, Material take off schedules, Annotation schedules or note blocks, Creating annotation schedule, Reusing schedule views. Practice: Hands on.","mandatory":true},{"id":"T017","module":"Revit - A","name":"S17 · Rooms & Area Plans","detail":"Rooms: Creating rooms, Room boundaries, Room volume, Situations that can effect Room volume computations, Room tag. Schedule Keys, Area: Area schemes, Area types, Area plans, tags, Color Scheme, Legend. Practice: Hands on.","mandatory":true},{"id":"T018","module":"Revit - A","name":"S18 · Sheets & Title Blocks","detail":"Sheets, Title Blocks: Creating title blocks, Revision workflow, Revision schedules on title block, Modifying views on sheet, Rotating views on sheet, Dividing view across multiple sheets, Sheet List, Print. Practice: Hands on.","mandatory":true},{"id":"T019","module":"Revit - A","name":"S19 · Lighting, Materials, Rendering & Solar Study","detail":"Lights: Lighting fixtures, Defining geometry of light source, Controlling the brightness of light source, Light groups. Materials: Creating material library, About the material properties and assets, Editing material properties, Creating material, Applying material to elements, Changing the graphic properties of a material, Changing the appearance properties of a material. Sun settings: Specifying sun settings, Using sun path. Rendering, Decals, Walkthrough. Solar study: Setting up and creating solar study. Practice: Hands on.","mandatory":true},{"id":"T020","module":"Revit - A","name":"S20 · Site Design & Toposurface","detail":"Site Design, Site Settings. Toposurface: Creating toposurface, Splitting a toposurface, Merging toposurface, Building pads, Property lines, Contour line labels, Parking components, Site components, Graded region. Practice: Hands on.","mandatory":true},{"id":"T021","module":"Revit - A","name":"S21 · Worksharing"," const DOM="@cadtrack.10xcadd.app"; // ID -> auth identity. Users only ever type their institute ID.
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>t&&t.toDate?t.toDate().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kolkata'})+' IST':'—';
const ST={taught:['Awaiting student response','#B7791F'],submitted:['Pending faculty review','#2F7BFF'],disputed:['Disputed — investigate','#C0362C'],clarification:['Clarification requested','#6D4AC2'],revision:['Revision required','#6D4AC2'],approved:['Approved','#12805C'],rejected:['Rejected','#C0362C']};
const RESP={covered_ok:'Topics covered; no revision needed',covered_revision:'Topics covered; some revision required',not_covered:'Some topics were not covered',clarify:'I need clarification before confirming'};
const pill=s=>`<span class="pill" style="background:${ST[s][1]}">${ST[s][0]}</span>`;
const S={user:null,courses:[],sessions:[],users:[],notes:[],tab:'home',unsub:[]};
const LOGO=`<svg width="34" height="34" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 70 428 165v182L256 442 84 347V165Z" fill="none" stroke="#2F7BFF" stroke-width="30" stroke-linejoin="round"/><path d="M178 262l56 56 104-114" fill="none" stroke="#F5B301" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const course=id=>S.courses.find(c=>c.id===id)||{name:id,topics:[]};
const tname=(cid,tid)=>{const t=(course(cid).topics||[]).find(x=>x.id===tid);return t?t.name:tid};

/* ===== progress: unique topic IDs only; sessions never count by themselves ===== */
function prog(c,sess){const T=(c.topics||[]).filter(t=>t.mandatory!==false),n=T.length||1;
 const set=f=>new Set(sess.filter(s=>s.courseId===c.id&&f(s)).flatMap(s=>s.topicIds));
 const pc=X=>Math.round(T.filter(t=>X.has(t.id)).length/n*100);
 return{cov:pc(set(()=>true)),ack:pc(set(s=>s.ackAt&&['covered_ok','covered_revision'].includes(s.resp))),ver:pc(set(s=>s.status==='approved')),T}}
const bars=p=>[['Teaching coverage',p.cov,'#2F7BFF'],['Student acknowledgement',p.ack,'#F5B301'],['Faculty-verified',p.ver,'#12805C']].map(([l,v,c])=>`<div class="row"><span>${l}</span><b>${v}%</b></div><div class="bar"><i style="width:${v}%;background:${c}"></i></div>`).join('');

/* ===== audit helpers (batched with the state change so both succeed or both fail) ===== */
function ev(b,s,type,from,to,reason){b.set(db.collection('sessionEvents').doc(),{sessionId:s.id,studentUid:s.studentUid,facultyUid:s.facultyUid,type,from:from||null,to:to||null,reason:reason||null,actorUid:S.user.uid,actorRole:S.user.role,actorId:S.user.loginId,at:TS()})}
function nt(b,to,text,sid){b.set(db.collection('notifications').doc(),{toUid:to,text,sessionId:sid,read:false,at:TS()})}

/* ===== auth ===== */
function showLogin(m){S.unsub.forEach(f=>f());S.unsub=[];$('#app').innerHTML=`<div id="login"><div style="text-align:center">${LOGO}<h1 style="margin:6px 0 0;color:var(--navy)">CADTrack 360</h1><div style="color:var(--mute)">by 10XCADD · ${ROLE} portal</div><p style="color:var(--blue);font-weight:600;margin:6px 0 18px">Every Session. Every Topic. Verified.</p></div>
<form class="card" id="lf"><label for="id">Student ID, Faculty ID or Admin ID</label><input id="id" autocomplete="username" required>
<label for="pw">Password</label><div style="display:flex;gap:6px"><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="btn alt" id="eye" aria-label="Show or hide password">Show</button></div>
<div class="err" id="er" role="alert">${esc(m||'')}</div><button class="btn" style="width:100%" id="go">Sign in</button></form></div>`;
 $('#eye').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password';$('#eye').textContent=p.type==='password'?'Show':'Hide'};
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;$('#go').textContent='Signing in…';try{await auth.signInWithEmailAndPassword((v=>v.includes('@')?v:v+DOM)($('#id').value.trim().toLowerCase()),$('#pw').value)}catch(x){$('#er').textContent='Wrong ID or password, or the account is suspended.';$('#go').disabled=false;$('#go').textContent='Sign in'}}}
auth.onAuthStateChanged(async u=>{if(!u){const m=S.flash;S.flash='';return showLogin(m)}
 try{const d=await db.doc('users/'+u.uid).get();if(!d.exists||d.data().status!=='active')throw 0;S.user={uid:u.uid,...d.data()};if(S.user.role!==ROLE){S.flash='This is the '+ROLE+' portal. Please use the link meant for your role.';S.user=null;return auth.signOut()}start()}
 catch(e){S.flash='This account is not active or not set up. Contact the administrator.';await auth.signOut()}});

function start(){const u=S.user,sc=db.collection('sessions');
 S.tab='home';S.unsub.forEach(f=>f());
 const q=u.role==='admin'?sc.limit(1000):sc.where(u.role==='student'?'studentUid':'facultyUid','==',u.uid);
 S.unsub=[db.collection('courses').onSnapshot(s=>{S.courses=s.docs.map(d=>({id:d.id,...d.data()}));render()},console.error),
  q.onSnapshot(s=>{S.sessions=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9));render()},console.error),
  db.collection('notifications').where('toUid','==',u.uid).onSnapshot(s=>{S.notes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at?.seconds||9e9)-(a.at?.seconds||9e9));render()},console.error)];
 if(u.role!=='student')S.unsub.push((u.role==='admin'?db.collection('users'):db.collection('users').where('role','==','student')).onSnapshot(s=>{S.users=s.docs.map(d=>({uid:d.id,...d.data()}));render()},console.error));
 render()}

/* ===== shell ===== */
const TABS={student:[['home','My courses'],['sessions','Sessions']],faculty:[['home','Review queue'],['record','Record session'],['sessions','All sessions'],['progress','Student progress']],admin:[['home','Overview'],['users','Users'],['courses','Courses & syllabus'],['sessions','Session register']]};
function render(){const u=S.user;if(!u)return;const unread=S.notes.filter(n=>!n.read).length;
 $('#app').innerHTML=`<header>${LOGO}<div><b>CADTrack 360</b><small>${esc(u.name)} · ${esc(u.loginId)} · ${u.role}</small></div><span class="sp"></span>
 <button class="btn alt sm" data-a="bell" aria-label="Notifications">Alerts${unread?` (${unread})`:''}</button><button class="btn alt sm" data-a="pw">Password</button><button class="btn alt sm" data-a="out">Log out</button></header>
 <nav>${TABS[u.role].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</nav><main>${VIEW[u.role][S.tab]()}</main>`}
const sessCard=(s,acts)=>`<div class="card"><div class="row"><b style="color:var(--ink)">${esc(s.title)}</b>${pill(s.status)}</div>
 <div style="font-size:14px;margin:6px 0">${esc(course(s.courseId).name)} · Trained on ${esc(s.date)} by ${esc(s.facultyName)}${S.user.role!=='student'?' · '+esc(s.studentName)+' ('+esc(s.studentId)+')':''}</div>
 <div style="font-size:14px">${s.topicIds.map(t=>'• '+esc(tname(s.courseId,t))).join('<br>')}</div>
 ${s.ackAt?`<div class="note" style="margin-top:8px">Response ${fmt(s.ackAt)} · ${'★'.repeat(s.rating)} · ${esc(RESP[s.resp])}${s.comment?'<br>'+esc(s.comment):''}</div>`:''}
 ${s.reviewNote?`<div class="note" style="margin-top:8px">Faculty note (${fmt(s.reviewedAt)}): ${esc(s.reviewNote)}</div>`:''}
 <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${acts}<button class="btn alt sm" data-a="hist" data-v="${s.id}">History</button></div></div>`;
const list=(arr,f)=>arr.length?arr.map(f).join(''):'<div class="empty">Nothing here yet.</div>';
const filt=(k)=>`<select data-a="flt" data-k="${k}" aria-label="Filter by status"><option value="">All statuses</option>${Object.keys(ST).map(s=>`<option value="${s}" ${S[k]===s?'selected':''}>${ST[s][0]}</option>`).join('')}</select>`;
const fl=(k,arr)=>S[k]?arr.filter(s=>s.status===S[k]):arr;

const VIEW={

 sessions(){return `<h2>Your sessions</h2>${filt('f1')}${list(fl('f1',S.sessions),s=>sessCard(s,['taught','clarification'].includes(s.status)?`<button class="btn" data-a="ack" data-v="${s.id}">Review and Acknowledge Session</button>`:''))}`}},
faculty:{

 record(){const cs=(S.user.courses||[]).map(course);

  <div id="rx"></div><label>Learning notes (optional)</label><textarea id="rn" rows="2"></textarea><button class="btn">Record session</button><p class="note">Recording a session does not approve it. Each student must respond, then you review.</p></form>`},
 sessions(){return `<h2>All sessions</h2>${filt('f2')}${list(fl('f2',S.sessions),s=>sessCard(s,''))}`},
 progress(){const rows=[];S.users.filter(u=>u.role==='student').forEach(st=>(st.courses||[]).filter(c=>(S.user.courses||[]).includes(c)).forEach(cid=>{const p=prog(course(cid),S.sessions.filter(s=>s.studentUid===st.uid));rows.push(`<tr><td>${esc(st.name)}<br><small>${esc(st.loginId)}</small></td><td>${esc(course(cid).name)}</td><td>${p.cov}%</td><td>${p.ack}%</td><td><b>${p.ver}%</b></td></tr>`)}));

admin:{
 home(){const A=S.users.filter(u=>u.status==='active'),c=s=>S.sessions.filter(x=>x.status===s).length;
  const k=[['Active students',A.filter(u=>u.role==='student').length],['Active faculty',A.filter(u=>u.role==='faculty').length],['Courses',S.courses.length],['Awaiting student',c('taught')],['Awaiting faculty',c('submitted')],['Disputed',c('disputed')],['Revision required',c('revision')],['Approved',c('approved')]];
  const stale=S.courses.filter(co=>{const l=S.sessions.filter(s=>s.courseId===co.id)[0];return !l||(Date.now()/1000-(l.createdAt?.seconds||0))>14*86400});

 sessions(){return `<h2>Session register</h2>${filt('f3')} <button class="btn alt sm" data-a="csv">Export CSV</button>${list(fl('f3',S.sessions),s=>sessCard(s,s.status!=='taught'?`<button class="btn rev sm" data-a="reopen" data-v="${s.id}">Reopen with reason</button>`:''))}`}}};

/* ===== dialogs ===== */
const dlg=$('#dlg');const open=h=>{dlg.innerHTML=h;if(!dlg.open)dlg.showModal()};const close=()=>dlg.open&&dlg.close();
const sess=id=>S.sessions.find(s=>s.id===id);
function ackDialog(id,keep){const s=sess(id),d=keep||JSON.parse(localStorage.getItem('draft-'+id)||'{}');
 open(`<h3>Review and acknowledge</h3><div class="note">Please review the session details carefully before submitting your response. By acknowledging this session, you confirm that you have reviewed the recorded training topics and are providing an accurate response about your learning experience.<br><br>If a topic was not covered, was only partially covered, or requires further explanation, use the appropriate feedback option instead of confirming something inaccurate.<br><br>Your response will be recorded with a timestamp and submitted for faculty review. Your acknowledgement does not, by itself, complete or approve the session.</div>
 <p><b>${esc(s.title)}</b> · ${esc(s.date)}<br>${s.topicIds.map(t=>'• '+esc(tname(s.courseId,t))).join('<br>')}</p>
 <form id="af"><label>Rating (required)</label><div class="stars" role="radiogroup">${[[1,'Very poor'],[2,'Needs significant improvement'],[3,'Satisfactory'],[4,'Good'],[5,'Excellent']].map(([n,l])=>`<label title="${l}"><input type="radio" name="r" value="${n}" ${d.rating==n?'checked':''}>${n} — ${l}</label>`).join('')}</div>
 <label style="display:block;margin-top:10px">Your response (required)</label>${Object.entries(RESP).map(([k,v])=>`<label class="c"><input type="radio" name="p" value="${k}" ${d.resp===k?'checked':''}>${v}</label>`).join('')}
 <label>Topics needing revision / not covered</label>${s.topicIds.map(t=>`<label class="c"><input type="checkbox" name="t" value="${t}" ${(d.revTopics||[]).includes(t)?'checked':''}>${esc(tname(s.courseId,t))}</label>`).join('')}
 <label>Comment (required if topics were not covered or you need clarification)</label><textarea name="c" rows="3">${esc(d.comment||'')}</textarea><div class="err" id="ae" role="alert"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn alt" data-a="draft" data-v="${id}">Save local draft</button><button type="button" class="btn alt" data-a="close">Cancel</button><button class="btn">Continue</button></div></form>`);
 $('#af').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r=+f.get('r'),p=f.get('p'),t=f.getAll('t'),c=(f.get('c')||'').trim(),m=$('#ae');
  if(!r)return m.textContent='Choose a rating from 1 to 5.';if(!p)return m.textContent='Choose how you want to respond.';
  if(p==='not_covered'&&!c)return m.textContent='Explain what was not covered.';if(p==='not_covered'&&!t.length)return m.textContent='Select the topics that were not covered.';
  if(p==='covered_revision'&&!t.length)return m.textContent='Select the topics that need revision.';if(p==='clarify'&&!c)return m.textContent='Tell faculty what you need clarified.';
  confirmAck(id,{rating:r,resp:p,revTopics:t,comment:c})}}
function confirmAck(id,d){open(`<h3>Confirm Session Response?</h3><p>You are about to submit your response for this training session. Your response, rating, comments, and relevant acknowledgement details will be recorded with a timestamp and made available to authorized faculty for review.</p><p>After submission, you will not be able to edit or withdraw this response yourself. If a correction is required, contact the administrator.</p><p>Your response does not mean that the session or the entire course is automatically approved. Verified progress will be updated only after the required review and completion conditions have been satisfied.</p><div class="err" id="ce" role="alert">${navigator.onLine?'':'You are offline. Connect to submit.'}</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn alt" id="gb">Go Back</button><button class="btn" id="cs" ${navigator.onLine?'':'disabled'}>Confirm and Submit</button></div>`);
 $('#gb').onclick=()=>ackDialog(id,d);
 $('#cs').onclick=async()=>{const s=sess(id),to=d.resp==='not_covered'?'disputed':'submitted',b=db.batch();$('#cs').disabled=true;$('#cs').textContent='Submitting…';
  b.update(db.doc('sessions/'+id),{status:to,rating:d.rating,resp:d.resp,comment:d.comment,revTopics:d.revTopics,ackAt:TS()});ev(b,s,'student_response',s.status,to,d.comment);nt(b,s.facultyUid,`${S.user.name} responded to "${s.title}"`,id);
  try{await b.commit();localStorage.removeItem('draft-'+id);close()}catch(e){$('#ce').textContent='Not submitted. This session may have changed or you are not permitted. Refresh and try again.';$('#cs').disabled=false;$('#cs').textContent='Confirm and Submit'}}}
function reviewDialog(id){const s=sess(id),prev=S.sessions.filter(x=>x.studentUid===s.studentUid&&x.id!==id&&x.topicIds.some(t=>s.topicIds.includes(t)));
 open(`<h3>Review: ${esc(s.title)}</h3><p>${esc(s.studentName)} (${esc(s.studentId)}) · ${esc(s.date)} · ${pill(s.status)}</p><p>${s.topicIds.map(t=>'• '+esc(tname(s.courseId,t))).join('<br>')}</p>
 <div class="note">${'★'.repeat(s.rating)} (${s.rating}/5) · ${esc(RESP[s.resp])} · ${fmt(s.ackAt)}<br>${esc(s.comment||'No comment')}<br>Flagged topics: ${(s.revTopics||[]).map(t=>esc(tname(s.courseId,t))).join(', ')||'none'}</div>
 ${s.status==='disputed'?'<p class="err">The student reports topics were not covered. This is not approvable without a written note, and does not count toward verified progress.</p>':''}
 <p style="font-size:13px;color:var(--mute)">Earlier sessions on these topics: ${prev.map(x=>esc(x.date)+' ('+ST[x.status][0]+')').join('; ')||'none'}</p>
 <label>Review note (required to reject, request clarification, require revision, or resolve a dispute)</label><textarea id="rv" rows="3"></textarea>
 <label>Topics to revise (for “Require revision”)</label>${s.topicIds.map(t=>`<label class="c"><input type="checkbox" name="rt" value="${t}" ${(s.revTopics||[]).includes(t)?'checked':''}>${esc(tname(s.courseId,t))}</label>`).join('')}<div class="err" id="re" role="alert"></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ok" data-a="dec" data-v="${id}" data-d="approved">Approve</button><button class="btn bad" data-a="dec" data-v="${id}" data-d="rejected">Reject</button><button class="btn rev" data-a="dec" data-v="${id}" data-d="clarification">Request clarification</button><button class="btn rev" data-a="dec" data-v="${id}" data-d="revision">Require revision</button><button class="btn alt" data-a="close">Close</button></div>`)}
async function decide(id,to){const s=sess(id),n=$('#rv').value.trim(),rt=[...document.querySelectorAll('[name=rt]:checked')].map(x=>x.value),m=$('#re');
 if(to==='approved'&&s.status==='disputed'&&!n)return m.textContent='Add a note explaining why the dispute is resolved.';
 if(to!=='approved'&&!n)return m.textContent='A note is required for this decision.';if(to==='revision'&&!rt.length)return m.textContent='Select topics to revise.';
 if(to==='approved'&&s.resp==='clarify')return m.textContent='The student asked for clarification. Request clarification instead.';
 const b=db.batch(),u={status:to,reviewNote:n,reviewedAt:TS(),reviewedBy:S.user.uid};if(to==='revision')u.facRevTopics=rt;
 b.update(db.doc('sessions/'+id),u);ev(b,s,'faculty_'+to,s.status,to,n);nt(b,s.studentUid,`"${s.title}": ${ST[to][0]}`,id);
 try{await b.commit();close()}catch(e){m.textContent='Not saved. You may not be assigned to this session, or it already changed.'}}
async function reason(title,fn){open(`<h3>${title}</h3><label>Reason (required, recorded in the audit history)</label><textarea id="rs" rows="3"></textarea><div class="err" id="rse"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn alt" data-a="close">Cancel</button><button class="btn" id="rok">Confirm</button></div>`);
 $('#rok').onclick=async()=>{const r=$('#rs').value.trim();if(!r)return $('#rse').textContent='A reason is required.';try{await fn(r);close()}catch(e){$('#rse').textContent='Not saved: '+e.message}}}
function history(id){db.collection('sessionEvents').where('sessionId','==',id).get().then(q=>{const e=q.docs.map(d=>d.data()).sort((a,b)=>(a.at?.seconds||0)-(b.at?.seconds||0));
 open(`<h3>Session history</h3>${e.map(x=>`<div class="card"><b>${esc(x.type)}</b> · ${fmt(x.at)}<br>${esc(x.actorId)} (${x.actorRole})<br>${esc(x.from||'—')} → ${esc(x.to||'—')}${x.reason?'<br><i>'+esc(x.reason)+'</i>':''}</div>`).join('')||'<div class="empty">No events.</div>'}<button class="btn alt" data-a="close">Close</button>`)}).catch(()=>open('<p>History unavailable.</p><button class="btn alt" data-a="close">Close</button>'))}

/* ===== admin forms ===== */
function newUser(){open(`<h3>Create account</h3><form id="uf"><label>Role</label><select id="ur"><option value="student">Student</option><option value="faculty">Faculty</option></select><label>Full name</label><input id="un" required><label>WhatsApp number (optional, to send the credentials)</label><input id="up" type="tel" inputmode="tel" placeholder="9876543210"><label>Courses</label>${S.courses.map(c=>`<label class="c"><input type="checkbox" name="uc" value="${c.id}">${esc(c.name)}</label>`).join('')||'<small>Create a course first.</small>'}<div class="err" id="ue"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn alt" data-a="close">Cancel</button><button class="btn">Create</button></div></form>`);
 $('#uf').onsubmit=async e=>{e.preventDefault();const role=$('#ur').value,pre=role==='student'?'S':'F',mx=Math.max(1000,...S.users.filter(u=>u.role===role).map(u=>parseInt(u.loginId.slice(1))||0)),id=pre+(mx+1),a=new Uint8Array(8);crypto.getRandomValues(a);const pw=[...a].map(x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('')+'A#';
  let sec;try{sec=firebase.apps.find(x=>x.name==='sec')||firebase.initializeApp(CFG,'sec');const c=await sec.auth().createUserWithEmailAndPassword(id.toLowerCase()+DOM,pw);
  await db.doc('users/'+c.user.uid).set({loginId:id,name:$('#un').value.trim(),phone:($('#up').value||'').replace(/\D/g,''),role,status:'active',courses:[...document.querySelectorAll('[name=uc]:checked')].map(x=>x.value),createdAt:TS(),createdBy:S.user.uid});await sec.auth().signOut();
  const nm=$('#un').value.trim(),link=new URL(role==='student'?'index.html':'faculty.html',location.href).href;S.ph=($('#up').value||'').replace(/\D/g,'');
  S.msg=`Hello ${nm},\n\nYour CADTrack 360 by 10XCADD ${role} account is ready.\n\nLogin ID: ${id}\nPassword: ${pw}\nLink: ${link}\n\nPlease change your password after your first login.`;
  open(`<h3>Account created</h3><textarea readonly rows="9">${esc(S.msg)}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok" data-a="wa">Send on WhatsApp</button><button class="btn alt" data-a="cp">Copy message</button><button class="btn alt" data-a="close">Done</button></div><p class="note">The password is shown once and is not stored. Send or copy it now.</p>`)}catch(x){$('#ue').textContent='Could not create: '+x.message}}}
function newCourse(){open(`<h3>Create course / syllabus version</h3><form id="cf"><label>Course ID (letters, no spaces, e.g. acad)</label><input id="ci" required pattern="[a-z0-9-]+"><label>Course name</label><input id="cn" required><label>Category</label><input id="cg" list="cats" required><datalist id="cats"><option>General CAD / AutoCAD<option>Civil<option>Mechanical<option>Interior Design</datalist>
 <label>Syllabus: one topic per line as <code>Module | Topic</code> (add <code>| optional</code> for optional topics). Paste your real syllabus.</label><textarea id="ct" rows="7" required></textarea><div class="err" id="ce2"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn alt" data-a="close">Cancel</button><button class="btn">Validate and save</button></div></form>`);
 $('#cf').onsubmit=async e=>{e.preventDefault();const ids=new Set(),topics=[],bad=[];$('#ct').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach((l,i)=>{const p=l.split('|').map(x=>x.trim());if(p.length<2||!p[0]||!p[1])return bad.push('Line '+(i+1)+': needs Module | Topic');const id='T'+String(topics.length+1).padStart(3,'0');ids.add(id);topics.push({id,module:p[0],name:p[1],mandatory:p[2]!=='optional'})});
  if(bad.length)return $('#ce2').textContent=bad.slice(0,3).join(' ; ');const ref=db.doc('courses/'+$('#ci').value),ex=await ref.get();if(ex.exists)return $('#ce2').textContent='That course ID exists. Use a new ID for a new syllabus version.';
  await ref.set({name:$('#cn').value.trim(),category:$('#cg').value.trim(),topics,version:1,createdAt:TS(),createdBy:S.user.uid});close()}}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v,u=S.user;
 if(a==='tab'){S.tab=v;render()}else if(a==='out')auth.signOut();else if(a==='close')close();
 else if(a==='ack')ackDialog(v);else if(a==='rev')reviewDialog(v);else if(a==='dec')decide(v,el.dataset.d);else if(a==='hist')history(v);
 else if(a==='draft'){const f=new FormData($('#af'));localStorage.setItem('draft-'+v,JSON.stringify({rating:+f.get('r')||0,resp:f.get('p'),revTopics:f.getAll('t'),comment:f.get('c')}));$('#ae').textContent='Draft saved on this device. It is NOT submitted.'}
 else if(a==='flt'){}else if(a==='newu')newUser();else if(a==='newc')newCourse();
 else if(a==='tog'){const t=S.users.find(x=>x.uid===v);await db.doc('users/'+v).update({status:t.status==='active'?'suspended':'active'})}
 else if(a==='asg'){const t=S.users.find(x=>x.uid===v),r=prompt('Course IDs, comma separated ('+S.courses.map(c=>c.id).join(', ')+')',(t.courses||[]).join(','));if(r!==null)await db.doc('users/'+v).update({courses:r.split(',').map(x=>x.trim()).filter(x=>S.courses.some(c=>c.id===x))})}
 else if(a==='reopen')reason('Reopen session',async r=>{const s=sess(v),b=db.batch();b.update(db.doc('sessions/'+v),{status:'taught',reopenReason:r,reopenedAt:TS(),reopenedBy:u.uid});ev(b,s,'admin_reopen',s.status,'taught',r);nt(b,s.studentUid,`"${s.title}" was reopened by admin`,v);await b.commit()});
